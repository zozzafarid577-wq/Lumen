<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgotten password | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>

<div class="auth-wrap">
  <aside class="auth-side">
    <a href="/" class="wordmark" aria-label="Lumen home">L<span class="u">u</span>men</a>
    <div>
      <h2>Let's get you back in</h2>
      <p>We will email you a link to set a new password. It is good for one hour.</p>
      <ul class="auth-points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Students can also ask their teacher for a reset</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Check your spam folder if it does not arrive</li>
      </ul>
    </div>
    <p style="font-size:.8rem;opacity:.6">© <span class="year">2026</span> Lumen</p>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a href="/" class="wordmark" style="font-size:1.6rem;margin-bottom:28px;display:inline-flex" aria-label="Lumen home">L<span class="u">u</span>men</a>
      <h1>Forgotten password</h1>
      <p class="lead">Enter the email you sign in with.</p>

      <div class="form-msg" id="msg" style="display:none" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" autofocus placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit">Email me a reset link</button>
      </form>

      <p class="auth-foot"><a href="/login.html">← Back to sign in</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script>
document.querySelectorAll('.year').forEach(el => { el.textContent = new Date().getFullYear(); });
const msg = document.getElementById('msg');

document.getElementById('forgot-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) { say('err', 'Enter your email address.'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/reset-password.html',
  });

  btn.disabled = false;
  btn.textContent = 'Email me a reset link';

  // The same answer either way. Telling a stranger that an address has no
  // account turns this form into a way of finding out who is on Lumen.
  if (error && isServiceOutage(error.message)) { say('err', friendlyError(error.message)); return; }
  say('ok', 'If that email has a Lumen account, a reset link is on its way. It is good for one hour.');
  e.target.reset();
});

function say(kind, text) {
  msg.className = 'form-msg' + (kind ? ' ' + kind : '');
  msg.textContent = text;
  msg.style.display = text ? 'block' : 'none';
}
</script>
</body>
</html>
