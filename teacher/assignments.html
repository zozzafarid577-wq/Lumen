<script>
let me = null;
let courses = [], assignments = [];
let tests = [], groups = [], setTests = [];
let editingA = null;
let markingId = null;

(async () => {
  me = await requireAuth(['teacher', 'assistant'], { perm: 'assignments' });
  if (!me) return;
  renderShell('teacher', me, { title: 'Assignments' });

  document.getElementById('rows').innerHTML = skeletonRows(6, 4);
  document.getElementById('ta-rows').innerHTML = skeletonRows(6, 3);
  await loadCourses();
  await Promise.all([loadAssignments(), loadTestsAndGroups()]);
  await loadSetTests();

  if (new URLSearchParams(location.search).get('action') === 'new') editAssignment();
})();

// ── Tests set to a group ──────────────────────────────────────────
function showTab(which) {
  const onTests = which === 'tests';
  document.getElementById('pane-tests').style.display = onTests ? '' : 'none';
  document.getElementById('pane-work').style.display = onTests ? 'none' : '';
  document.getElementById('tab-tests').classList.toggle('on', onTests);
  document.getElementById('tab-work').classList.toggle('on', !onTests);
}

async function loadTestsAndGroups() {
  const [{ data: t }, { data: g }] = await Promise.all([
    sb.from('practice_tests')
      .select('id, title, course_id, test_sections(name, color)')
      .eq('teacher_id', me.teacher_id).eq('is_active', true)
      .order('order_index').order('created_at'),
    sb.from('groups').select('id, course_id, name, days, start_time')
      .eq('teacher_id', me.teacher_id).order('name'),
  ]);
  tests = t || [];
  // order('name') is the database's collation, which puts "Group 10"
  // before "Group 2". Put in a person's order before anything reads it.
  groups = sortByName(g);

  const pick = document.getElementById('ta-test');
  pick.innerHTML = tests.length
    ? tests.map(x => {
        const course = courses.find(c => c.id === x.course_id);
        // The section is the whole reason two of these are told apart. A
        // language teacher sets a vocabulary paper and a grammar paper on
        // the same lesson, and without this the list offers the same
        // title twice and the teacher picks by guessing.
        //
        // As text, not a badge: an <option> renders no markup, so the
        // colour that carries this everywhere else cannot come along.
        const section = x.test_sections?.name;
        return `<option value="${x.id}">${escHtml(x.title)}`
          + `${section ? ' · ' + escHtml(section) : ''}`
          + `${course ? ' — ' + escHtml(course.title) : ''}</option>`;
      }).join('')
    : '<option value="">No tests yet</option>';
  onTestPicked();
}

// The groups offered are the ones on the picked test's course: a group
// from another course cannot be given this test — the database refuses
// that pairing, and offering it would be a trap.
function onTestPicked() {
  const test = tests.find(x => x.id === document.getElementById('ta-test').value);
  const mine = test ? groups.filter(g => g.course_id === test.course_id) : [];
  document.getElementById('ta-group').innerHTML =
    '<option value="">The whole course</option>'
    + mine.map(g => `<option value="${g.id}">${escHtml(groupLabel(g))}</option>`).join('');
}

async function loadSetTests() {
  const { data, error } = await sb.from('test_assignments')
    .select('id, due_at, group_id, test_id, course_id, groups(name, days, start_time), practice_tests(title, test_sections(name, color), test_attempts(id))')
    .eq('teacher_id', me.teacher_id).order('due_at', { nullsFirst: false });

  const tbody = document.getElementById('ta-rows');
  if (error) {
    // A space that has not run migration v8 has no such table. Say which
    // update is missing rather than leaving skeleton rows spinning.
    tbody.innerHTML = emptyRow(6, /relation|schema cache|does not exist/i.test(error.message)
      ? 'Setting tests needs the latest database update (migration v8).'
      : friendlyError(error.message));
    return;
  }

  setTests = data || [];
  document.getElementById('ta-count').textContent =
    setTests.length ? `${setTests.length} set` : 'Nothing set yet';

  if (!setTests.length) { tbody.innerHTML = emptyRow(6, 'No tests set yet — pick one above.'); return; }

  const now = new Date();
  tbody.innerHTML = setTests.map(a => {
    const course = courses.find(c => c.id === a.course_id);
    const done = (a.practice_tests?.test_attempts || []).length;
    const late = a.due_at && new Date(a.due_at) < now;
    return `<tr>
      <td>
        <div style="font-weight:600">${escHtml(a.practice_tests?.title || '—')}</div>
        ${sectionBadge(a.practice_tests?.test_sections)}
      </td>
      <td class="small muted">${escHtml(course?.title || '—')}</td>
      <td class="small">${a.groups ? escHtml(groupLabel(a.groups)) : '<span class="badge b-gray">Whole course</span>'}</td>
      <td class="small ${late ? '' : 'muted'}">${a.due_at
        ? `${late ? '<span class="badge b-red">Past</span> ' : ''}${fmtDateTime(a.due_at)}`
        : 'No deadline'}</td>
      <td class="num muted">${done}</td>
      <td style="text-align:right">
        <button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="unsetTest('${a.id}')">Remove</button>
      </td>
    </tr>`;
  }).join('');
}

async function assignTest() {
  const testId = document.getElementById('ta-test').value;
  if (!testId) { say('ta-alert', 'Build a test first — there is nothing to set.'); return; }

  const test = tests.find(x => x.id === testId);
  const due = document.getElementById('ta-due').value;

  const btn = document.getElementById('ta-save');
  btn.disabled = true;
  const { error } = await sb.from('test_assignments').insert({
    teacher_id: me.teacher_id,
    test_id: testId,
    course_id: test.course_id,
    group_id: document.getElementById('ta-group').value || null,
    due_at: due ? new Date(due).toISOString() : null,
  });
  btn.disabled = false;

  if (error) {
    // The two partial unique indexes are what catch the same test being
    // set to the same group twice, with two different dates.
    say('ta-alert', /duplicate|unique/i.test(error.message)
      ? 'That test is already set to them. Remove the old one first, or pick another group.'
      : friendlyError(error.message));
    return;
  }

  say('ta-alert', '');
  document.getElementById('ta-due').value = '';
  await loadSetTests();
  showToast('Test set.', 'success');
}

async function unsetTest(id) {
  const a = setTests.find(x => x.id === id);
  if (!confirm(`Stop setting "${a?.practice_tests?.title || 'this test'}"? Results already in are kept.`)) return;

  const { error } = await sb.from('test_assignments').delete().eq('id', id);
  if (error) { showToast(friendlyError(error.message), 'error'); return; }
  await loadSetTests();
  showToast('No longer set.', 'success');
}

async function loadCourses() {
  const { data } = await sb.from('courses').select('id, title')
    .eq('teacher_id', me.teacher_id).eq('is_active', true).order('title');
  courses = data || [];
  document.getElementById('am-course').innerHTML = courses.length
    ? courses.map(c => `<option value="${c.id}">${escHtml(c.title)}</option>`).join('')
    : '<option value="">No courses yet</option>';
}

async function loadAssignments() {
  const { data, error } = await sb.from('assignments')
    .select('*, courses(title), assignment_submissions(id, score)')
    .eq('teacher_id', me.teacher_id).order('created_at', { ascending: false });

  const tbody = document.getElementById('rows');
  if (error) { tbody.innerHTML = emptyRow(6, friendlyError(error.message)); return; }
  assignments = data || [];

  document.getElementById('count').textContent = `${assignments.length} assignment${assignments.length === 1 ? '' : 's'}`;
  if (!assignments.length) { tbody.innerHTML = emptyRow(6, 'Nothing set yet.'); return; }

  tbody.innerHTML = assignments.map(a => {
    const subs = a.assignment_submissions || [];
    const toMark = subs.filter(s => s.score == null).length;
    const overdue = a.due_at && new Date(a.due_at) < new Date();
    return `<tr>
      <td>
        <div style="font-weight:600">${escHtml(a.title)}</div>
        <div class="small muted">out of ${a.max_score}${a.is_active ? '' : ' · hidden'}</div>
      </td>
      <td class="small muted">${escHtml(a.courses?.title || '—')}</td>
      <td class="small ${overdue ? '' : 'muted'}">${a.due_at ? fmtDateTime(a.due_at) : 'No deadline'}</td>
      <td class="small">${subs.length}</td>
      <td>${toMark ? `<span class="badge b-yellow">${toMark}</span>` : '<span class="small muted">—</span>'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-xs" onclick="openMarking('${a.id}')">Hand-ins</button>
        <button class="btn btn-ghost btn-xs" onclick="editAssignment('${a.id}')">Edit</button>
        <button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="deleteAssignment('${a.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

// ── Create / edit ─────────────────────────────────────────────────
function editAssignment(id) {
  if (!courses.length) { showToast('Create a course first.', 'error'); return; }
  const a = id ? assignments.find(x => x.id === id) : null;
  editingA = a || null;

  document.getElementById('am-title').textContent = a ? 'Edit assignment' : 'New assignment';
  document.getElementById('am-name').value = a?.title || '';
  document.getElementById('am-desc').value = a?.description || '';
  document.getElementById('am-course').value = a?.course_id || courses[0].id;
  document.getElementById('am-due').value = toLocalInput(a?.due_at);
  document.getElementById('am-file').value = a?.file_url || '';
  document.getElementById('am-max').value = a?.max_score ?? 100;
  document.getElementById('am-active').checked = a ? a.is_active : true;
  say('am-alert', '');
  openModal('a-modal');
}

async function saveAssignment() {
  const title = document.getElementById('am-name').value.trim();
  if (!title) { say('am-alert', 'Give the assignment a title.'); return; }

  const max = parseInt(document.getElementById('am-max').value, 10);
  const due = document.getElementById('am-due').value;
  const row = {
    teacher_id: me.teacher_id,
    course_id: document.getElementById('am-course').value,
    title,
    description: document.getElementById('am-desc').value.trim() || null,
    due_at: due ? new Date(due).toISOString() : null,
    file_url: document.getElementById('am-file').value.trim() || null,
    max_score: Number.isFinite(max) && max > 0 ? max : 100,
    is_active: document.getElementById('am-active').checked,
  };

  const btn = document.getElementById('am-save');
  btn.disabled = true;
  const { error } = editingA
    ? await sb.from('assignments').update(row).eq('id', editingA.id)
    : await sb.from('assignments').insert(row);
  btn.disabled = false;

  if (error) { say('am-alert', friendlyError(error.message)); return; }
  closeModal('a-modal');
  showToast('Assignment saved.', 'success');
  await loadAssignments();
}

async function deleteAssignment(id) {
  const a = assignments.find(x => x.id === id);
  const subs = (a?.assignment_submissions || []).length;
  if (!confirm(subs
    ? `Delete "${a.title}"? ${subs} hand-in${subs === 1 ? '' : 's'} will go with it.`
    : 'Delete this assignment?')) return;

  const { error } = await sb.from('assignments').delete().eq('id', id);
  if (error) { showToast(friendlyError(error.message), 'error'); return; }
  showToast('Assignment deleted.', 'success');
  await loadAssignments();
}

// ── Marking ───────────────────────────────────────────────────────
async function openMarking(id) {
  markingId = id;
  const a = assignments.find(x => x.id === id);
  document.getElementById('mk-title').textContent = a ? a.title : 'Hand-ins';
  document.getElementById('mk-body').innerHTML = '<div class="skel" style="height:100px"></div>';
  openModal('mark-modal');

  const { data, error } = await sb.from('assignment_submissions')
    .select('*, profiles(full_name)')
    .eq('assignment_id', id).order('submitted_at', { ascending: false });

  const body = document.getElementById('mk-body');
  if (error) { body.innerHTML = `<div class="alert alert-error">${escHtml(friendlyError(error.message))}</div>`; return; }
  if (!data?.length) { body.innerHTML = emptyState('Nothing handed in yet', 'When students hand their work in it will appear here for marking.'); return; }

  body.innerHTML = data.map(s => `
    <div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px">
      <div class="spread mb8">
        <div>
          <div style="font-weight:600;font-size:.86rem">${escHtml(s.profiles?.full_name || 'Unknown student')}</div>
          <div class="small muted">Handed in ${fmtDateTime(s.submitted_at)}${s.graded_at ? ' · marked ' + fmtDate(s.graded_at) : ''}</div>
        </div>
        ${s.score == null ? '<span class="badge b-yellow">To mark</span>' : `<span class="badge b-green">${s.score} / ${a?.max_score ?? 100}</span>`}
      </div>
      ${s.text_answer ? `<p class="small" style="white-space:pre-wrap;background:var(--bg);border-radius:9px;padding:10px 12px;margin-bottom:10px">${escHtml(s.text_answer)}</p>` : ''}
      ${s.file_url ? `<p class="small mb8"><a href="${escHtml(s.file_url)}" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600">Open what they handed in</a></p>` : ''}
      <div class="form-row">
        <div class="form-group" style="margin-bottom:8px">
          <label class="form-label">Mark (out of ${a?.max_score ?? 100})</label>
          <input type="number" class="form-input" id="sc-${s.id}" min="0" max="${a?.max_score ?? 100}" value="${s.score ?? ''}">
        </div>
        <div class="form-group" style="margin-bottom:8px">
          <label class="form-label">Feedback</label>
          <input type="text" class="form-input" id="fb-${s.id}" value="${escHtml(s.feedback || '')}" placeholder="A line for the student">
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveMark('${s.id}', ${a?.max_score ?? 100})">Save mark</button>
    </div>`).join('');
}

async function saveMark(submissionId, maxScore) {
  const score = parseInt(document.getElementById('sc-' + submissionId).value, 10);
  const feedback = document.getElementById('fb-' + submissionId).value.trim();

  if (!Number.isFinite(score) || score < 0 || score > maxScore) {
    showToast(`Enter a mark between 0 and ${maxScore}.`, 'error');
    return;
  }

  const { error } = await sb.from('assignment_submissions')
    .update({ score, feedback: feedback || null, graded_at: new Date().toISOString() })
    .eq('id', submissionId);
  if (error) { showToast(friendlyError(error.message), 'error'); return; }

  showToast('Mark saved.', 'success');
  await openMarking(markingId);
  await loadAssignments();
}

function say(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? 'flex' : 'none';
}
</script>
</body>
