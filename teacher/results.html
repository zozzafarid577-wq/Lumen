<style>
  /* ── The paper ──────────────────────────────────────────────────
     A sat paper, marked, in the order the student answered it. It
     replaces the list rather than opening over it, because the thing
     a teacher does with it next is print it, and a modal prints
     badly — the page behind it comes too. */
  .paper-q {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 17px; margin-bottom: 12px; background: var(--card);
  }
  .paper-q.wrong { border-color: #E9B9C2; background: #FDF4F6; }
  .paper-q.right { border-color: #BFE3D5; background: #F4FBF8; }
  [data-theme="dark"] .paper-q.wrong { background: rgba(142,29,47,.14); }
  [data-theme="dark"] .paper-q.right { background: rgba(15,94,67,.14); }

  .paper-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .paper-n {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: .72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .paper-text { flex: 1; font-size: .92rem; font-weight: 600; line-height: 1.5; }
  .paper-mark { flex-shrink: 0; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .paper-mark.wrong { color: var(--danger); }
  .paper-mark.right { color: var(--success); }
  .paper-mark.blank { color: var(--muted); }

  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 11px; border-radius: 9px; font-size: .86rem; line-height: 1.45;
    border: 1px solid transparent; margin-bottom: 5px;
  }
  .opt-letter {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--border); font-size: .66rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  /* The two that matter are marked; everything else stays quiet, so a
     teacher's eye goes to the answer and the mistake and nowhere else. */
  .opt.correct { background: #E7F4EF; border-color: #BFE3D5; }
  .opt.correct .opt-letter { border-color: var(--success); color: var(--success); }
  .opt.chosen-wrong { background: #FCEDEF; border-color: #F3CBD2; }
  .opt.chosen-wrong .opt-letter { border-color: var(--danger); color: var(--danger); }
  [data-theme="dark"] .opt.correct { background: rgba(15,94,67,.2); }
  [data-theme="dark"] .opt.chosen-wrong { background: rgba(142,29,47,.2); }
  .opt-tag { margin-left: auto; font-size: .66rem; font-weight: 700; white-space: nowrap; padding-left: 8px; }
  .opt.correct .opt-tag { color: var(--success); }
  .opt.chosen-wrong .opt-tag { color: var(--danger); }

  .paper-why {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: .82rem; color: var(--text-2); line-height: 1.55;
  }
  .paper-hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .paper-score { font-size: 2rem; font-weight: 800; line-height: 1; font-family: 'Manrope', sans-serif; }

  /* The most-missed list, which is the one thing here that is about the
     class rather than about one student. */
  .miss-row { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .miss-row:last-child { border-bottom: none; }
  .miss-bar { flex: 1; height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; min-width: 60px; }
  .miss-bar i { display: block; height: 100%; background: var(--danger); }
  .miss-n { font-size: .74rem; font-weight: 700; color: var(--danger); white-space: nowrap; }

  /* ── Printing ──────────────────────────────────────────────────
     What goes on paper is the paper: no sidebar, no filters, no
     buttons, and colours that survive a printer being asked not to
     print backgrounds. */
  @media print {
    .main { margin: 0 !important; }
    .content { padding: 0 !important; max-width: none !important; }
    .card { border: none !important; box-shadow: none !important; }
    /* portal.css pins .printable to inset:0, which is right for a
       result card that fits on one screen and wrong for a paper that
       runs over several pages: pinned, everything past page one is
       cropped away. */
    .printable { position: static !important; }
    .paper-q { break-inside: avoid; page-break-inside: avoid; }
    .print-head { display: block !important; }
    body { background: #fff !important; }
    .opt, .paper-q { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  .print-head { display: none; margin-bottom: 18px; }
</style>

<script>
// Yesterday's hardest questions, emailed now to the address set under
// Students → Groups — the same email that goes out every morning.
async function sendHardest() {
  if (!confirm("Email yesterday's hardest questions to the teacher now?")) return;
  const btn = document.getElementById('hard-btn');
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
  try {
    const out = await apiPost('/api/support', { flow: 'hard-questions-send' });
    const t = out.teachers[0];
    if (!t) showToast('That report was already sent for yesterday, or nobody sat a test yesterday.', 'error');
    else if (t.error) showToast(t.error, 'error');
    else if (!t.questions) showToast('Nobody got a question wrong yesterday — nothing to send.', 'success');
    else {
      const ok = t.sent.filter(x => x.sent).map(x => x.to);
      if (ok.length) showToast(`Sent to ${ok.join(', ')} · ${t.questions} questions from ${t.attempts} tests.`, 'success');
      else showToast(`Could not send it: ${t.sent[0]?.error || 'the mail provider refused it'}`, 'error');
    }
  } catch (err) { showToast(err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

let me = null;
let attempts = [];         // finished attempts, newest first
let tests = [];            // this teacher's tests
let questionsByTest = new Map();   // test_id -> ordered questions
let openAttempt = null;

const LETTERS = 'ABCDEFGHIJ';

(async () => {
  me = await requireAuth(['teacher', 'assistant'], { perm: 'students' });
  if (!me) return;
  renderShell('teacher', me, { title: 'Test results' });

  document.getElementById('rows').innerHTML = skeletonRows(7, 6);
  await load();
  render();

  ['q', 'test-filter', 'course-filter', 'outcome-filter'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));

  // Arriving from a student's row on another page: show theirs first.
  const wanted = new URLSearchParams(location.search).get('student');
  if (wanted) {
    document.getElementById('q').value =
      attempts.find(a => a.student_id === wanted)?.student_name || '';
    render();
  }
})();

// ── Loading ───────────────────────────────────────────────────────
// Three reads, not one per attempt. A tenant's tables are small and
// joining them here costs nothing next to the round trips.
async function load() {
  const [rows, testRows, courses] = await Promise.all([
    sb.from('test_attempts')
      .select('id, student_id, test_id, answers, score, max_score, percentage, passed, time_taken_sec, completed_at, profiles(full_name, email)')
      .eq('teacher_id', me.teacher_id)
      .not('completed_at', 'is', null)
      .order('completed_at', { ascending: false }),
    sb.from('practice_tests').select('id, title, course_id, passing_score_pct, courses(title)')
      .eq('teacher_id', me.teacher_id).order('title'),
    sb.from('courses').select('id, title').eq('teacher_id', me.teacher_id).order('title'),
  ]);

  if (rows.error) {
    document.getElementById('rows').innerHTML = emptyRow(7, friendlyError(rows.error.message));
    return;
  }

  tests = testRows.data || [];
  const testById = new Map(tests.map(t => [t.id, t]));

  attempts = (rows.data || []).map(a => ({
    ...a,
    student_name: a.profiles?.full_name || 'A student',
    student_email: a.profiles?.email || '',
    test: testById.get(a.test_id) || null,
  }));

  document.getElementById('test-filter').innerHTML = '<option value="">All tests</option>'
    + tests.map(t => `<option value="${t.id}">${escHtml(t.title)}</option>`).join('');
  document.getElementById('course-filter').innerHTML = '<option value="">All courses</option>'
    + (courses.data || []).map(c => `<option value="${c.id}">${escHtml(c.title)}</option>`).join('');
}

// A test's questions are only fetched when a paper is opened, because
// most of them never will be.
async function questionsFor(testId) {
  if (questionsByTest.has(testId)) return questionsByTest.get(testId);
  const { data } = await sb.from('test_questions')
    .select('id, question_text, options, explanation, image_url, order_index, points')
    .eq('teacher_id', me.teacher_id).eq('test_id', testId)
    .order('order_index');
  const list = data || [];
  questionsByTest.set(testId, list);
  return list;
}

// ── The list ──────────────────────────────────────────────────────
function visible() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const testId = document.getElementById('test-filter').value;
  const courseId = document.getElementById('course-filter').value;
  const outcome = document.getElementById('outcome-filter').value;

  return attempts.filter(a => {
    if (testId && a.test_id !== testId) return false;
    if (courseId && a.test?.course_id !== courseId) return false;
    if (outcome === 'passed' && !a.passed) return false;
    if (outcome === 'failed' && a.passed) return false;
    if (q && !`${a.student_name} ${a.test?.title || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const list = visible();

  document.getElementById('count').textContent =
    `${list.length} of ${attempts.length} finished test${attempts.length === 1 ? '' : 's'}`;

  const tbody = document.getElementById('rows');
  if (!list.length) {
    tbody.innerHTML = emptyRow(7, attempts.length
      ? 'No results match those filters.'
      : 'Nobody has finished a test yet.');
  } else {
    tbody.innerHTML = list.map(a => {
      return `<tr>
        <td>
          <button class="link-name" onclick="openPaper('${a.id}')">${escHtml(a.student_name)}</button>
          <div class="small muted">${escHtml(a.student_email)}</div>
        </td>
        <td class="small">${escHtml(a.test?.title || 'A deleted test')}
          ${a.test?.courses?.title ? `<div class="small muted">${escHtml(a.test.courses.title)}</div>` : ''}</td>
        <td class="num"><span class="badge ${a.passed ? 'b-green' : 'b-red'}">${mark(a)}</span></td>
        <td class="num small">${a.passed ? 'Passed' : 'Not passed'}</td>
        <td class="num small muted">${fmtDuration(a.time_taken_sec)}</td>
        <td class="small muted">${fmtDateTime(a.completed_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-outline btn-xs" onclick="openPaper('${a.id}')">See the paper</button>
        </td>
      </tr>`;
    }).join('');
  }

  drawMostMissed(list);
}

function fmtDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const m = Math.floor(sec / 60);
  return m < 1 ? `${sec}s` : `${m} min`;
}

// ── Most missed ───────────────────────────────────────────────────
// The question a teacher actually wants answering after a test: which
// ones did the class not get. Only drawn for a single test, where the
// question means something.
async function drawMostMissed(list) {
  const testId = document.getElementById('test-filter').value;
  const card = document.getElementById('miss-card');

  if (!testId || list.length < 2) { card.style.display = 'none'; return; }

  const questions = await questionsFor(testId);
  if (!questions.length) { card.style.display = 'none'; return; }

  const rows = questions.map((q, i) => {
    let wrong = 0;
    list.forEach(a => { if (!isRight(q, (a.answers || {})[q.id])) wrong++; });
    return { q, i, wrong, pct: Math.round((wrong / list.length) * 100) };
  }).filter(r => r.wrong).sort((a, b) => b.wrong - a.wrong).slice(0, 8);

  document.getElementById('miss-sub').textContent =
    `${list.length} student${list.length === 1 ? '' : 's'} sat it`;

  document.getElementById('miss-body').innerHTML = rows.length
    ? rows.map(r => `
      <div class="miss-row">
        <span class="small" style="flex:1;min-width:0">
          <strong>Q${r.i + 1}.</strong> ${escHtml(trim(r.q.question_text, 90))}
        </span>
        <span class="miss-bar"><i style="width:${r.pct}%"></i></span>
        <span class="miss-n">${r.wrong} wrong</span>
      </div>`).join('')
    : '<p class="small muted">Everybody got every question right.</p>';

  card.style.display = 'block';
}

function trim(text, n) {
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

// ── Marking ───────────────────────────────────────────────────────
// The same rule the portal scores by, written once here so the paper
// and the most-missed list cannot disagree about what "wrong" means.
//
// A question can have more than one right answer, and a student only
// scores by picking all of them and nothing else — so the comparison is
// between two sets, not two values.
function rightIndexes(q) {
  return (q.options || []).map((o, i) => (o?.correct ? i : -1)).filter(i => i >= 0);
}

function givenIndexes(given) {
  if (Array.isArray(given)) return given.map(Number).filter(n => Number.isInteger(n));
  return Number.isInteger(given) ? [given] : [];
}

function isRight(q, given) {
  const want = rightIndexes(q);
  const got = givenIndexes(given);
  if (!got.length || want.length !== got.length) return false;
  return want.every(i => got.includes(i));
}

// ── One paper ─────────────────────────────────────────────────────
async function openPaper(attemptId) {
  const a = attempts.find(x => x.id === attemptId);
  if (!a) return;
  openAttempt = a;

  const questions = await questionsFor(a.test_id);
  const answers = a.answers || {};
  document.getElementById('p-student').textContent = a.student_name;
  document.getElementById('p-test').textContent =
    `${a.test?.title || 'A deleted test'}${a.test?.courses?.title ? ' · ' + a.test.courses.title : ''}`;
  document.getElementById('p-pct').textContent = mark(a);
  document.getElementById('p-score').textContent = a.passed ? 'Passed' : 'Not passed';

  // The same two lines, for the top of the printed sheet.
  document.getElementById('pr-title').textContent = `${a.student_name} — ${a.test?.title || 'Test'}`;
  document.getElementById('pr-sub').textContent =
    `${mark(a)} · finished ${fmtDateTime(a.completed_at)}`;

  const wrong = questions.filter(q => !isRight(q, answers[q.id])).length;
  const blank = questions.filter(q => !givenIndexes(answers[q.id]).length).length;

  document.getElementById('p-badges').innerHTML = [
    `<span class="badge ${a.passed ? 'b-green' : 'b-red'}">${a.passed ? 'Passed' : 'Did not pass'}</span>`,
    a.test?.passing_score_pct != null ? `<span class="small muted">Pass mark ${passMarks(a.test.passing_score_pct, a.max_score)}</span>` : '',
    `<span class="small muted">${questions.length - wrong} right · ${wrong} wrong${blank ? ` · ${blank} left blank` : ''}</span>`,
    `<span class="small muted">Took ${fmtDuration(a.time_taken_sec)}</span>`,
    `<span class="small muted">Finished ${fmtDateTime(a.completed_at)}</span>`,
  ].filter(Boolean).join('');

  document.getElementById('p-questions').innerHTML = questions.length
    ? questions.map((q, i) => drawQuestion(q, i, answers[q.id])).join('')
    : '<div class="card"><div class="card-body"><p class="small muted">This test’s questions have been deleted, so the paper cannot be shown.</p></div></div>';

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('paper-view').style.display = 'block';
  document.getElementById('paper-actions').style.display = 'flex';
  window.scrollTo(0, 0);
}

function drawQuestion(q, i, given) {
  const got = givenIndexes(given);
  const right = isRight(q, given);
  const blank = !got.length;

  const mark = blank
    ? '<span class="paper-mark blank">Left blank</span>'
    : right ? '<span class="paper-mark right">Right</span>'
            : '<span class="paper-mark wrong">Wrong</span>';

  const options = (q.options || []).map((o, oi) => {
    const isCorrect = !!o?.correct;
    const chose = got.includes(oi);
    // A chosen right answer needs one label, not two stacked on top of
    // each other, so the tags are decided together rather than per flag.
    const cls = isCorrect ? 'correct' : (chose ? 'chosen-wrong' : '');
    const tag = isCorrect && chose ? 'Their answer · correct'
      : isCorrect ? 'Correct answer'
      : chose ? 'Their answer'
      : '';
    return `
      <div class="opt ${cls}">
        <span class="opt-letter">${LETTERS[oi] || oi + 1}</span>
        <span>${escHtml(o?.text ?? '')}</span>
        ${tag ? `<span class="opt-tag">${tag}</span>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="paper-q ${blank ? '' : right ? 'right' : 'wrong'}">
      <div class="paper-head">
        <span class="paper-n">${i + 1}</span>
        <span class="paper-text">${escHtml(q.question_text)}</span>
        ${mark}
      </div>
      ${q.image_url ? `<img src="${escHtml(q.image_url)}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:12px">` : ''}
      ${options}
      ${q.explanation ? `<div class="paper-why"><strong>Why:</strong> ${escHtml(q.explanation)}</div>` : ''}
    </div>`;
}

function closePaper() {
  openAttempt = null;
  document.getElementById('paper-view').style.display = 'none';
  document.getElementById('paper-actions').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
}
</script>
