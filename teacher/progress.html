<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/portal.css">
<script>try{if(localStorage.getItem('lumen_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  /* A row you can open. The detail is a second <tr> underneath rather
     than a modal: a teacher comparing two students wants both open at
     once, which a modal cannot do. */
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover { background: var(--bg); }
  .tbl tbody tr.open { background: var(--primary-soft); }
  .row-chev { display: inline-flex; color: var(--muted); transition: transform .2s; }
  .row-chev svg { width: 16px; height: 16px; }
  tr.open .row-chev { transform: rotate(180deg); }
  .detail-cell { padding: 0 !important; background: var(--bg); }
  .detail-inner { padding: 16px 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .detail-inner { grid-template-columns: 1fr; } }
  .detail-h {
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-bottom: 9px;
  }
  .mini-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: .8rem; }
  .mini-row:last-child { border-bottom: none; }
  .mini-name { flex: 1; min-width: 0; }
  .mini-sub { font-size: .7rem; color: var(--muted); margin-top: 1px; }
  .mini-unit { font-size: .7rem; font-weight: 700; color: var(--text-2); margin: 11px 0 3px; }
  .mini-unit:first-child { margin-top: 0; }
  .tick { width: 16px; height: 16px; flex-shrink: 0; }
  .tick.done { color: var(--success); }
  .tick.not  { color: var(--border); }

  /* ── Group chips ───────────────────────────────────────────────
     A teacher thinks in classes, not in one long list, so the classes
     are the first thing on the page and the rest follows whichever is
     pressed. */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 7px; cursor: pointer;
    padding: 8px 14px; border-radius: 9999px; font-size: .82rem; font-weight: 600;
    background: var(--card); border: 1px solid var(--border); color: var(--text-2);
    transition: .15s;
  }
  .chip:hover { border-color: var(--primary-l); color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip .when { font-weight: 500; font-size: .74rem; opacity: .75; }
  .chip .n { font-size: .72rem; opacity: .75; }

  /* ── The printed week ──────────────────────────────────────────
     What goes on paper is the sheet: no sidebar, no chips, no buttons,
     and the group and the dates at the top so it still means something
     a fortnight later. */
  @media print {
    .main { margin: 0 !important; }
    .content { padding: 0 !important; max-width: none !important; }
    .card { border: none !important; box-shadow: none !important; }
    .printable { position: static !important; }
    .no-print, .sidebar, .topbar { display: none !important; }
    .print-only { display: block !important; }
    body { background: #fff !important; }
    .tbl tbody tr { break-inside: avoid; page-break-inside: avoid; }
  }
  .print-only { display: none; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">Progress</span>
    </div>
  </header>

  <main class="content">

    <div class="stats-grid no-print">
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div class="stat-n" id="s-avg">—</div>
        <div class="stat-l">Class average</div>
        <div class="stat-hint">Best attempt per test</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="stat-n" id="s-pass">—</div>
        <div class="stat-l">Passing</div>
        <div class="stat-hint">Students at or above the pass mark</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div>
        <div class="stat-n" id="s-risk">—</div>
        <div class="stat-l">Need attention</div>
        <div class="stat-hint">Under 50%, or nothing done</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <div class="stat-n" id="s-lessons">—</div>
        <div class="stat-l">Lessons watched</div>
        <div class="stat-hint">Marked done by students</div>
      </div>
    </div>

    <!-- One chip per class. A teacher thinks in groups — "how did
         Sunday do?" — not in a single list of everybody they teach. -->
    <div class="chips no-print" id="group-chips"></div>

    <!-- ── THIS WEEK ─────────────────────────────────────────────
         A sheet for one week and one group, made to be printed and
         handed over. `printable` is not decoration: portal.css prints
         by hiding everything and showing that class back. -->
    <div class="card mb16 printable" id="week-card">
      <div class="card-header" style="flex-wrap:wrap;gap:12px">
        <div>
          <span class="card-title" id="week-title">This week</span>
          <div class="small muted" id="week-sub">—</div>
        </div>
        <div class="row no-print" style="gap:8px">
          <button class="btn btn-outline btn-sm" onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
          <button class="btn btn-outline btn-sm" onclick="shiftWeek(1)" id="week-next" aria-label="Next week">›</button>
          <button class="btn btn-outline btn-sm" onclick="shiftWeek(0, true)">This week</button>
          <button class="btn btn-primary btn-sm" onclick="window.print()">Print</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Student</th><th>Tests sat this week</th><th class="num">Average</th><th class="num">Lessons</th></tr>
          </thead>
          <tbody id="week-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card no-print">
      <div class="card-header" style="flex-wrap:wrap;gap:12px">
        <span class="card-title">Every student</span>
        <div class="row">
          <input type="search" class="form-input" id="q" placeholder="Search…" style="max-width:220px" aria-label="Search students">
          <select class="form-select" id="sort" style="max-width:190px" aria-label="Sort">
            <option value="risk">Weakest first</option>
            <option value="best">Strongest first</option>
            <option value="name">By name</option>
          </select>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Student</th><th class="num">Tests done</th><th class="num">Average</th><th class="num">Best</th><th class="num">Lessons</th><th>Last seen</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;
let summary = [];
let allTests = [];
let allLessons = [];
let enrolmentsBy = new Map();
let groups = [];              // every class, in the order they read best
let pickedGroup = null;       // null = everybody
let weekOffset = 0;           // 0 = the week we are in

// The week runs Sunday to Saturday, which is the school week here and
// also how `groups.days` is numbered (0 = Sunday), so the two never
// need reconciling.
function weekStart(offset = 0) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay() + offset * 7);
  return d;
}

function weekRange(offset = 0) {
  const from = weekStart(offset);
  const to = new Date(from);
  to.setDate(to.getDate() + 7);
  return [from, to];
}

// "21 – 27 September" — or across a month boundary, "28 September – 4 October".
function weekLabel(offset = 0) {
  const [from, to] = weekRange(offset);
  const last = new Date(to); last.setDate(last.getDate() - 1);
  const d = (x) => x.getDate();
  const mon = (x) => x.toLocaleDateString('en-GB', { month: 'long' });
  const year = last.getFullYear();
  return from.getMonth() === last.getMonth()
    ? `${d(from)} – ${d(last)} ${mon(last)} ${year}`
    : `${d(from)} ${mon(from)} – ${d(last)} ${mon(last)} ${year}`;
}

// Which students are in the chosen class. A student on two courses can
// be in two groups, so this asks whether they are in THIS one.
function inPickedGroup(s) {
  if (!pickedGroup) return true;
  return (enrolmentsBy.get(s.id) || []).some(e => e.group_id === pickedGroup);
}

(async () => {
  me = await requireAuth(['teacher', 'assistant'], { perm: 'reports' });
  if (!me) return;
  renderShell('teacher', me, { title: 'Progress' });

  document.getElementById('rows').innerHTML = skeletonRows(7, 5);
  await load();

  // Arriving from a student's page: open that student straight away,
  // rather than making the teacher find the name again in the list.
  const wanted = new URLSearchParams(location.search).get('student');
  if (wanted && summary.some(s => s.id === wanted)) {
    open.add(wanted);
    render();
    document.querySelector('tr.open')?.scrollIntoView({ block: 'center' });
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('sort').addEventListener('change', render);
})();

async function load() {
  // A handful of reads rather than one per student: the tables are small
  // per tenant, and joining them in the browser costs nothing next to N
  // round trips. Everything the opened rows need comes down here too, so
  // expanding a student is instant and silent.
  const [students, attempts, completions, tests, lessons, enrolments] = await Promise.all([
    // parent_email comes down with them: the report button needs to know
    // whether there is anywhere to send it before it is pressed.
    sb.from('profiles').select('id, full_name, email, parent_email')
      .eq('teacher_id', me.teacher_id).eq('role', 'student').eq('is_active', true).order('full_name'),
    // Every attempt, not just the best: "passed on the third go" is a
    // different fact about a student than "passed".
    sb.from('test_attempts').select('student_id, test_id, percentage, passed, completed_at')
      .eq('teacher_id', me.teacher_id).not('completed_at', 'is', null),
    sb.from('lesson_completions').select('student_id, lesson_id, completed_at').eq('teacher_id', me.teacher_id),
    sb.from('practice_tests').select('id, title, course_id, passing_score_pct, is_active')
      .eq('teacher_id', me.teacher_id),
    sb.from('lessons').select('id, title, order_index, modules(id, title, course_id, order_index)')
      .eq('teacher_id', me.teacher_id),
    // The group comes down with the enrolment: it is what the chips at
    // the top of the page are made of, and what the weekly sheet is for.
    sb.from('enrollments')
      .select('student_id, course_id, group_id, courses(title), groups(id, name, days, start_time)')
      .eq('teacher_id', me.teacher_id),
  ]);

  allTests = tests.data || [];
  allLessons = (lessons.data || []).filter(l => l.modules);
  enrolmentsBy = new Map();
  const byId = new Map();
  (enrolments.data || []).forEach(e => {
    if (!enrolmentsBy.has(e.student_id)) enrolmentsBy.set(e.student_id, []);
    enrolmentsBy.get(e.student_id).push(e);
    // Every class somebody is actually in. A group with nobody in it is
    // a chip that filters to an empty page, so the enrolments decide
    // which chips exist rather than the groups table.
    if (e.groups?.id) byId.set(e.groups.id, e.groups);
  });

  // In the order a week runs, so the chips read like a timetable:
  // Sunday's class first, then Monday's, and a group with no day set
  // after the ones that have one.
  groups = [...byId.values()].sort((a, b) => {
    const day = (g) => (g.days || []).length ? Math.min(...g.days) : 9;
    return day(a) - day(b)
      || String(a.start_time || '').localeCompare(String(b.start_time || ''))
      || a.name.localeCompare(b.name);
  });

  if (students.error) {
    document.getElementById('rows').innerHTML = emptyRow(7, friendlyError(students.error.message));
    return;
  }

  const byStudent = new Map((students.data || []).map(s =>
    [s.id, { ...s, attempts: [], lessons: 0, doneAt: new Map(), lastSeen: null }]));
  (attempts.data || []).forEach(a => {
    const s = byStudent.get(a.student_id);
    if (!s) return;
    s.attempts.push(a);
    if (!s.lastSeen || a.completed_at > s.lastSeen) s.lastSeen = a.completed_at;
  });
  (completions.data || []).forEach(c => {
    const s = byStudent.get(c.student_id);
    if (!s) return;
    s.lessons++;
    s.doneAt.set(c.lesson_id, c.completed_at);
    if (!s.lastSeen || c.completed_at > s.lastSeen) s.lastSeen = c.completed_at;
  });

  summary = [...byStudent.values()].map(s => {
    const best = bestAttempts(s.attempts);
    const avg = bestAverage(s.attempts);
    return {
      ...s,
      sat: best.length,
      avg,
      top: best.length ? Math.round(Math.max(...best.map(a => parseFloat(a.percentage)))) : null,
    };
  });

  const withMarks = summary.filter(s => s.avg != null);
  setStat('s-avg', withMarks.length ? Math.round(withMarks.reduce((t, s) => t + s.avg, 0) / withMarks.length) : null, '%');
  setStat('s-pass', summary.filter(s => s.avg != null && s.avg >= 60).length);
  setStat('s-risk', summary.filter(s => s.avg == null || s.avg < 50).length);
  setStat('s-lessons', summary.reduce((t, s) => t + s.lessons, 0));

  render();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;

  const list = summary
    .filter(inPickedGroup)
    .filter(s => !q || `${s.full_name} ${s.email || ''}`.toLowerCase().includes(q))
    .sort((a, b) => {
      if (sort === 'name') return a.full_name.localeCompare(b.full_name);
      // A student who has done nothing is the one most worth looking at,
      // so they sort above a low mark rather than below everyone.
      const av = a.avg == null ? -1 : a.avg;
      const bv = b.avg == null ? -1 : b.avg;
      return sort === 'best' ? bv - av : av - bv;
    });

  drawChips();
  drawWeek();

  const tbody = document.getElementById('rows');
  if (!list.length) { tbody.innerHTML = emptyRow(7, summary.length ? 'Nobody matches that search.' : 'No active students yet.'); return; }

  tbody.innerHTML = list.map(s => `
    <tr class="clickable${open.has(s.id) ? ' open' : ''}" onclick="toggleStudent('${s.id}')">
      <td>
        <div style="font-weight:600">${escHtml(s.full_name)}</div>
        <div class="small muted">${escHtml(s.email || '')}</div>
      </td>
      <td class="num">${s.sat}</td>
      <td class="num">${s.avg == null ? '<span class="muted">—</span>' : `<span class="badge ${badgeFor(s.avg)}">${s.avg}%</span>`}</td>
      <td class="num muted">${s.top == null ? '—' : s.top + '%'}</td>
      <td class="num muted">${s.lessons}</td>
      <td class="small muted">${s.lastSeen ? timeAgo(s.lastSeen) : 'Never'}</td>
      <td style="text-align:right"><span class="row-chev">${chevron()}</span></td>
    </tr>
    ${open.has(s.id) ? `<tr><td class="detail-cell" colspan="7">${detailFor(s)}</td></tr>` : ''}`).join('');
}

// ── One student, opened ───────────────────────────────────────────
// Every mark they have and every lesson they were given, rather than the
// counts the row above carries. More than one can be open at once: a
// teacher comparing two students should not have to remember the first.
const open = new Set();

function toggleStudent(id) {
  if (open.has(id)) open.delete(id); else open.add(id);
  render();
}

// ── The classes, as chips ─────────────────────────────────────────
function drawChips() {
  const host = document.getElementById('group-chips');
  const count = (id) => summary.filter(s =>
    (enrolmentsBy.get(s.id) || []).some(e => e.group_id === id)).length;

  const chip = (id, name, when, n) => `
    <button class="chip${pickedGroup === id ? ' on' : ''}" onclick="pickGroup(${id ? `'${id}'` : 'null'})">
      <span>${escHtml(name)}</span>
      ${when ? `<span class="when">${escHtml(when)}</span>` : ''}
      <span class="n">${n}</span>
    </button>`;

  host.innerHTML = chip(null, 'All students', '', summary.length)
    + groups.map(g => chip(g.id, g.name, groupWhen(g), count(g.id))).join('');
}

function pickGroup(id) {
  pickedGroup = id;
  render();
}

function shiftWeek(by, reset) {
  weekOffset = reset ? 0 : weekOffset + by;
  if (weekOffset > 0) weekOffset = 0;      // next week has not happened yet
  drawWeek();
}

// ── One week, one class, on one sheet ─────────────────────────────
function drawWeek() {
  const [from, to] = weekRange(weekOffset);
  const picked = groups.find(g => g.id === pickedGroup);

  document.getElementById('week-title').textContent =
    picked ? `${picked.name} — ${weekLabel(weekOffset)}` : weekLabel(weekOffset);
  document.getElementById('week-sub').textContent = picked
    ? [groupWhen(picked), me.teacher?.display_name].filter(Boolean).join(' · ')
    : 'Every student' + (me.teacher?.display_name ? ' · ' + me.teacher.display_name : '');
  document.getElementById('week-next').disabled = weekOffset >= 0;

  const within = (iso) => {
    if (!iso) return false;
    const d = new Date(iso);
    return d >= from && d < to;
  };

  const rows = summary.filter(inPickedGroup).map(s => {
    const sat = s.attempts.filter(a => within(a.completed_at));
    const marks = sat.map(a => parseFloat(a.percentage)).filter(n => !isNaN(n));
    const lessons = [...s.doneAt.values()].filter(within).length;
    return { s, sat, marks, lessons };
  });

  const tbody = document.getElementById('week-rows');
  const busy = rows.filter(r => r.sat.length || r.lessons);

  if (!rows.length) {
    tbody.innerHTML = emptyRow(4, 'Nobody is in this class yet.');
    return;
  }
  if (!busy.length) {
    tbody.innerHTML = emptyRow(4, 'Nothing was done in this week.');
    return;
  }

  // Everybody in the class is listed, including the ones who did
  // nothing: a sheet that quietly leaves them out is the sheet that
  // stops anyone noticing.
  tbody.innerHTML = rows.map(({ s, sat, marks, lessons }) => {
    const avg = marks.length ? Math.round(marks.reduce((x, y) => x + y, 0) / marks.length) : null;
    const titles = sat.map(a => {
      const t = allTests.find(t => t.id === a.test_id);
      const pct = Math.round(parseFloat(a.percentage) || 0);
      return `<div class="small" style="margin-bottom:2px">${escHtml(t?.title || 'A test')}
        <strong style="color:${a.passed ? 'var(--success)' : 'var(--danger)'}">${pct}%</strong></div>`;
    }).join('');

    return `<tr>
      <td><strong>${escHtml(s.full_name)}</strong></td>
      <td>${titles || '<span class="small muted">Nothing this week</span>'}</td>
      <td class="num">${avg == null ? '<span class="muted">—</span>' : `<span class="badge ${avg >= 50 ? 'b-green' : 'b-red'}">${avg}%</span>`}</td>
      <td class="num small muted">${lessons || '—'}</td>
    </tr>`;
  }).join('');
}

function chevron() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
}

function detailFor(s) {
  const courseIds = new Set((enrolmentsBy.get(s.id) || []).map(e => e.course_id));
  const courseName = new Map((enrolmentsBy.get(s.id) || []).map(e => [e.course_id, e.courses?.title || 'Course']));
  if (!courseIds.size) {
    return '<div class="detail-inner"><p class="small muted">Not enrolled on any course.</p></div>';
  }
  return `<div class="detail-inner">
    <div>${testDetail(s, courseIds)}</div>
    <div>${lessonDetail(s, courseIds, courseName)}</div>
  </div>
  ${parentRow(s)}`;
}

// The one thing a teacher does with this page that is not reading it.
// The numbers are gathered on the server when it is pressed, not taken
// from what happens to be on screen.
function parentRow(s) {
  const to = (s.parent_email || '').trim();
  return `<div style="padding:0 18px 18px">
    <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();emailParent('${s.id}')"
              ${to ? '' : 'disabled'}>
        Email this to the parent \u00b7 \u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062a\u0642\u0631\u064a\u0631 \u0644\u0648\u0644\u064a \u0627\u0644\u0623\u0645\u0631
      </button>
      <span class="small muted">${to
        ? escHtml(to)
        : 'No parent email on their account \u2014 add one on the Students page.'}</span>
    </div>
  </div>`;
}

async function emailParent(id) {
  const s = summary.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Email ${s.full_name}'s progress to ${s.parent_email}?`)) return;

  try {
    const out = await apiPost('/api/students', { action: 'email_progress', student_id: id });
    showToast(out.sent
      ? `Sent to ${out.to}.`
      : `Could not send it: ${out.error || 'the mail provider refused it'}`,
      out.sent ? 'success' : 'error');
  } catch (err) { showToast(err.message, 'error'); }
}

function testDetail(s, courseIds) {
  // Only the tests this student was actually set. A paper on a course
  // they are not on is not a zero for them, it is none of their business.
  const mine = allTests.filter(t => t.is_active && courseIds.has(t.course_id));
  if (!mine.length) return '<div class="detail-h">Tests</div><p class="small muted">No tests on their courses yet.</p>';

  const byTest = new Map();
  s.attempts.forEach(a => {
    if (!byTest.has(a.test_id)) byTest.set(a.test_id, []);
    byTest.get(a.test_id).push(a);
  });

  return `<div class="detail-h">Every test · ${mine.length}</div>` + mine.map(t => {
    const tries = (byTest.get(t.id) || []).sort((a, b) => a.completed_at.localeCompare(b.completed_at));
    if (!tries.length) {
      return `<div class="mini-row">
        <div class="mini-name"><div>${escHtml(t.title)}</div>
          <div class="mini-sub">pass at ${t.passing_score_pct}%</div></div>
        <span class="badge b-gray">Not done</span>
      </div>`;
    }
    const best = tries.reduce((a, b) => (parseFloat(b.percentage) > parseFloat(a.percentage) ? b : a));
    // The exact mark, not a band — and every attempt after the first,
    // because improving from 41 to 78 is the thing worth seeing.
    const others = tries.length > 1
      ? ' · tried ' + tries.length + ' times: ' + tries.map(a => pct(a.percentage)).join(', ')
      : '';
    return `<div class="mini-row">
      <div class="mini-name"><div>${escHtml(t.title)}</div>
        <div class="mini-sub">${fmtDate(best.completed_at)} · pass at ${t.passing_score_pct}%${others}</div></div>
      <span class="badge ${best.passed ? 'b-green' : 'b-red'}">${pct(best.percentage)}</span>
    </div>`;
  }).join('');
}

function lessonDetail(s, courseIds, courseName) {
  const mine = allLessons.filter(l => courseIds.has(l.modules.course_id));
  if (!mine.length) return '<div class="detail-h">Lessons</div><p class="small muted">No lessons on their courses yet.</p>';

  // Grouped by unit and in the teacher's own order, so this reads like
  // the course does rather than like a database table.
  const units = new Map();
  mine.forEach(l => {
    const key = l.modules.id;
    if (!units.has(key)) units.set(key, { unit: l.modules, lessons: [] });
    units.get(key).lessons.push(l);
  });

  const ordered = [...units.values()].sort((a, b) =>
    (a.unit.course_id).localeCompare(b.unit.course_id) || (a.unit.order_index - b.unit.order_index));

  const done = mine.filter(l => s.doneAt.has(l.id)).length;

  return `<div class="detail-h">Lessons · ${done} of ${mine.length} done</div>` + ordered.map(({ unit, lessons }) => `
    <div class="mini-unit">${escHtml(courseName.get(unit.course_id) || '')} · ${escHtml(unit.title)}</div>
    ${lessons.sort((a, b) => a.order_index - b.order_index).map(l => {
      const at = s.doneAt.get(l.id);
      return `<div class="mini-row">
        <svg class="tick ${at ? 'done' : 'not'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          ${at ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="9"/>'}
        </svg>
        <div class="mini-name"><div${at ? '' : ' class="muted"'}>${escHtml(l.title)}</div>
          ${at ? `<div class="mini-sub">${fmtDate(at)}</div>` : ''}</div>
      </div>`;
    }).join('')}`).join('');
}

function badgeFor(avg) {
  if (avg >= 75) return 'b-green';
  if (avg >= 50) return 'b-yellow';
  return 'b-red';
}
