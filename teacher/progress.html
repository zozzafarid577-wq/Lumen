<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/portal.css">
<script>try{if(localStorage.getItem('lumen_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  /* A row you can open. The detail is a second <tr> underneath rather
     than a modal: a teacher comparing two students wants both open at
     once, which a modal cannot do. */
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover { background: var(--bg); }
  .tbl tbody tr.open { background: var(--primary-soft); }
  .row-chev { display: inline-flex; color: var(--muted); transition: transform .2s; }
  .row-chev svg { width: 16px; height: 16px; }
  tr.open .row-chev { transform: rotate(180deg); }
  .detail-cell { padding: 0 !important; background: var(--bg); }
  .detail-inner { padding: 16px 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .detail-inner { grid-template-columns: 1fr; } }
  .detail-h {
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin-bottom: 9px;
  }
  .mini-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: .8rem; }
  .mini-row:last-child { border-bottom: none; }
  .mini-name { flex: 1; min-width: 0; }
  .mini-sub { font-size: .7rem; color: var(--muted); margin-top: 1px; }
  .mini-unit { font-size: .7rem; font-weight: 700; color: var(--text-2); margin: 11px 0 3px; }
  .mini-unit:first-child { margin-top: 0; }
  .tick { width: 16px; height: 16px; flex-shrink: 0; }
  .tick.done { color: var(--success); }
  .tick.not  { color: var(--border); }
</style>
</head>
<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">Progress</span>
    </div>
  </header>

  <main class="content">

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div class="stat-n" id="s-avg">—</div>
        <div class="stat-l">Class average</div>
        <div class="stat-hint">Best attempt per test</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="stat-n" id="s-pass">—</div>
        <div class="stat-l">Passing</div>
        <div class="stat-hint">Students at or above the pass mark</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div>
        <div class="stat-n" id="s-risk">—</div>
        <div class="stat-l">Need attention</div>
        <div class="stat-hint">Under 50%, or nothing sat</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <div class="stat-n" id="s-lessons">—</div>
        <div class="stat-l">Lessons watched</div>
        <div class="stat-hint">Marked done by students</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:12px">
        <span class="card-title">Every student</span>
        <div class="row">
          <input type="search" class="form-input" id="q" placeholder="Search…" style="max-width:220px" aria-label="Search students">
          <select class="form-select" id="sort" style="max-width:190px" aria-label="Sort">
            <option value="risk">Weakest first</option>
            <option value="best">Strongest first</option>
            <option value="name">By name</option>
          </select>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Student</th><th class="num">Tests sat</th><th class="num">Average</th><th class="num">Best</th><th class="num">Lessons</th><th>Last seen</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;
let summary = [];
let allTests = [];
let allLessons = [];
let enrolmentsBy = new Map();

(async () => {
  me = await requireAuth(['teacher', 'assistant'], { perm: 'reports' });
  if (!me) return;
  renderShell('teacher', me, { title: 'Progress' });

  document.getElementById('rows').innerHTML = skeletonRows(7, 5);
  await load();

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('sort').addEventListener('change', render);
})();

async function load() {
  // A handful of reads rather than one per student: the tables are small
  // per tenant, and joining them in the browser costs nothing next to N
  // round trips. Everything the opened rows need comes down here too, so
  // expanding a student is instant and silent.
  const [students, attempts, completions, tests, lessons, enrolments] = await Promise.all([
    sb.from('profiles').select('id, full_name, email')
      .eq('teacher_id', me.teacher_id).eq('role', 'student').eq('is_active', true).order('full_name'),
    // Every attempt, not just the best: "passed on the third go" is a
    // different fact about a student than "passed".
    sb.from('test_attempts').select('student_id, test_id, percentage, passed, completed_at')
      .eq('teacher_id', me.teacher_id).not('completed_at', 'is', null),
    sb.from('lesson_completions').select('student_id, lesson_id, completed_at').eq('teacher_id', me.teacher_id),
    sb.from('practice_tests').select('id, title, course_id, passing_score_pct, is_active')
      .eq('teacher_id', me.teacher_id),
    sb.from('lessons').select('id, title, order_index, modules(id, title, course_id, order_index)')
      .eq('teacher_id', me.teacher_id),
    sb.from('enrollments').select('student_id, course_id, courses(title)').eq('teacher_id', me.teacher_id),
  ]);

  allTests = tests.data || [];
  allLessons = (lessons.data || []).filter(l => l.modules);
  enrolmentsBy = new Map();
  (enrolments.data || []).forEach(e => {
    if (!enrolmentsBy.has(e.student_id)) enrolmentsBy.set(e.student_id, []);
    enrolmentsBy.get(e.student_id).push(e);
  });

  if (students.error) {
    document.getElementById('rows').innerHTML = emptyRow(7, friendlyError(students.error.message));
    return;
  }

  const byStudent = new Map((students.data || []).map(s =>
    [s.id, { ...s, attempts: [], lessons: 0, doneAt: new Map(), lastSeen: null }]));
  (attempts.data || []).forEach(a => {
    const s = byStudent.get(a.student_id);
    if (!s) return;
    s.attempts.push(a);
    if (!s.lastSeen || a.completed_at > s.lastSeen) s.lastSeen = a.completed_at;
  });
  (completions.data || []).forEach(c => {
    const s = byStudent.get(c.student_id);
    if (!s) return;
    s.lessons++;
    s.doneAt.set(c.lesson_id, c.completed_at);
    if (!s.lastSeen || c.completed_at > s.lastSeen) s.lastSeen = c.completed_at;
  });

  summary = [...byStudent.values()].map(s => {
    const best = bestAttempts(s.attempts);
    const avg = bestAverage(s.attempts);
    return {
      ...s,
      sat: best.length,
      avg,
      top: best.length ? Math.round(Math.max(...best.map(a => parseFloat(a.percentage)))) : null,
    };
  });

  const withMarks = summary.filter(s => s.avg != null);
  setStat('s-avg', withMarks.length ? Math.round(withMarks.reduce((t, s) => t + s.avg, 0) / withMarks.length) : null, '%');
  setStat('s-pass', summary.filter(s => s.avg != null && s.avg >= 60).length);
  setStat('s-risk', summary.filter(s => s.avg == null || s.avg < 50).length);
  setStat('s-lessons', summary.reduce((t, s) => t + s.lessons, 0));

  render();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;

  const list = summary
    .filter(s => !q || `${s.full_name} ${s.email || ''}`.toLowerCase().includes(q))
    .sort((a, b) => {
      if (sort === 'name') return a.full_name.localeCompare(b.full_name);
      // A student who has sat nothing is the one most worth looking at,
      // so they sort above a low mark rather than below everyone.
      const av = a.avg == null ? -1 : a.avg;
      const bv = b.avg == null ? -1 : b.avg;
      return sort === 'best' ? bv - av : av - bv;
    });

  const tbody = document.getElementById('rows');
  if (!list.length) { tbody.innerHTML = emptyRow(7, summary.length ? 'Nobody matches that search.' : 'No active students yet.'); return; }

  tbody.innerHTML = list.map(s => `
    <tr class="clickable${open.has(s.id) ? ' open' : ''}" onclick="toggleStudent('${s.id}')">
      <td>
        <div style="font-weight:600">${escHtml(s.full_name)}</div>
        <div class="small muted">${escHtml(s.email || '')}</div>
      </td>
      <td class="num">${s.sat}</td>
      <td class="num">${s.avg == null ? '<span class="muted">—</span>' : `<span class="badge ${badgeFor(s.avg)}">${s.avg}%</span>`}</td>
      <td class="num muted">${s.top == null ? '—' : s.top + '%'}</td>
      <td class="num muted">${s.lessons}</td>
      <td class="small muted">${s.lastSeen ? timeAgo(s.lastSeen) : 'Never'}</td>
      <td style="text-align:right"><span class="row-chev">${chevron()}</span></td>
    </tr>
    ${open.has(s.id) ? `<tr><td class="detail-cell" colspan="7">${detailFor(s)}</td></tr>` : ''}`).join('');
}

// ── One student, opened ───────────────────────────────────────────
// Every mark they have and every lesson they were given, rather than the
// counts the row above carries. More than one can be open at once: a
// teacher comparing two students should not have to remember the first.
const open = new Set();

function toggleStudent(id) {
  if (open.has(id)) open.delete(id); else open.add(id);
  render();
}

function chevron() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
}

function detailFor(s) {
  const courseIds = new Set((enrolmentsBy.get(s.id) || []).map(e => e.course_id));
  const courseName = new Map((enrolmentsBy.get(s.id) || []).map(e => [e.course_id, e.courses?.title || 'Course']));
  if (!courseIds.size) {
    return '<div class="detail-inner"><p class="small muted">Not enrolled on any course.</p></div>';
  }
  return `<div class="detail-inner">
    <div>${testDetail(s, courseIds)}</div>
    <div>${lessonDetail(s, courseIds, courseName)}</div>
  </div>`;
}

function testDetail(s, courseIds) {
  // Only the tests this student was actually set. A paper on a course
  // they are not on is not a zero for them, it is none of their business.
  const mine = allTests.filter(t => t.is_active && courseIds.has(t.course_id));
  if (!mine.length) return '<div class="detail-h">Tests</div><p class="small muted">No tests on their courses yet.</p>';

  const byTest = new Map();
  s.attempts.forEach(a => {
    if (!byTest.has(a.test_id)) byTest.set(a.test_id, []);
    byTest.get(a.test_id).push(a);
  });

  return `<div class="detail-h">Every test · ${mine.length}</div>` + mine.map(t => {
    const tries = (byTest.get(t.id) || []).sort((a, b) => a.completed_at.localeCompare(b.completed_at));
    if (!tries.length) {
      return `<div class="mini-row">
        <div class="mini-name"><div>${escHtml(t.title)}</div>
          <div class="mini-sub">pass at ${t.passing_score_pct}%</div></div>
        <span class="badge b-gray">Not sat</span>
      </div>`;
    }
    const best = tries.reduce((a, b) => (parseFloat(b.percentage) > parseFloat(a.percentage) ? b : a));
    // The exact mark, not a band — and every attempt after the first,
    // because improving from 41 to 78 is the thing worth seeing.
    const others = tries.length > 1
      ? ' · tried ' + tries.length + ' times: ' + tries.map(a => pct(a.percentage)).join(', ')
      : '';
    return `<div class="mini-row">
      <div class="mini-name"><div>${escHtml(t.title)}</div>
        <div class="mini-sub">${fmtDate(best.completed_at)} · pass at ${t.passing_score_pct}%${others}</div></div>
      <span class="badge ${best.passed ? 'b-green' : 'b-red'}">${pct(best.percentage)}</span>
    </div>`;
  }).join('');
}

function lessonDetail(s, courseIds, courseName) {
  const mine = allLessons.filter(l => courseIds.has(l.modules.course_id));
  if (!mine.length) return '<div class="detail-h">Lessons</div><p class="small muted">No lessons on their courses yet.</p>';

  // Grouped by unit and in the teacher's own order, so this reads like
  // the course does rather than like a database table.
  const units = new Map();
  mine.forEach(l => {
    const key = l.modules.id;
    if (!units.has(key)) units.set(key, { unit: l.modules, lessons: [] });
    units.get(key).lessons.push(l);
  });

  const ordered = [...units.values()].sort((a, b) =>
    (a.unit.course_id).localeCompare(b.unit.course_id) || (a.unit.order_index - b.unit.order_index));

  const done = mine.filter(l => s.doneAt.has(l.id)).length;

  return `<div class="detail-h">Lessons · ${done} of ${mine.length} done</div>` + ordered.map(({ unit, lessons }) => `
    <div class="mini-unit">${escHtml(courseName.get(unit.course_id) || '')} · ${escHtml(unit.title)}</div>
    ${lessons.sort((a, b) => a.order_index - b.order_index).map(l => {
      const at = s.doneAt.get(l.id);
      return `<div class="mini-row">
        <svg class="tick ${at ? 'done' : 'not'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          ${at ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="9"/>'}
        </svg>
        <div class="mini-name"><div${at ? '' : ' class="muted"'}>${escHtml(l.title)}</div>
          ${at ? `<div class="mini-sub">${fmtDate(at)}</div>` : ''}</div>
      </div>`;
    }).join('')}`).join('');
}

function badgeFor(avg) {
  if (avg >= 75) return 'b-green';
  if (avg >= 50) return 'b-yellow';
  return 'b-red';
}
</script>
</body>
</html>
