<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>

<div class="auth-wrap">
  <aside class="auth-side">
    <a href="/" class="wordmark" aria-label="Lumen home">L<span class="u">u</span>men</a>
    <div>
      <h2>Choose a new password</h2>
      <p>Pick something you have not used elsewhere. You will be signed out of other devices.</p>
    </div>
    <p style="font-size:.8rem;opacity:.6">© <span class="year">2026</span> Lumen</p>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a href="/" class="wordmark" style="font-size:1.6rem;margin-bottom:28px;display:inline-flex" aria-label="Lumen home">L<span class="u">u</span>men</a>
      <h1>New password</h1>
      <p class="lead">Set the password you will use from now on.</p>

      <div class="form-msg" id="msg" style="display:none" role="alert"></div>

      <form id="reset-form" novalidate style="display:none">
        <div class="field">
          <label for="password">New password</label>
          <div style="position:relative">
            <input type="password" id="password" required minlength="8" autocomplete="new-password" style="padding-right:70px" placeholder="At least 8 characters">
            <button type="button" id="pw-toggle"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:.76rem;font-weight:700;color:var(--primary);cursor:pointer">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input type="password" id="confirm" required minlength="8" autocomplete="new-password" placeholder="Repeat the password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit">Save new password</button>
      </form>

      <p class="auth-foot"><a href="/login.html">← Back to sign in</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script>
document.querySelectorAll('.year').forEach(el => { el.textContent = new Date().getFullYear(); });
const msg = document.getElementById('msg');
const form = document.getElementById('reset-form');
const pwField = document.getElementById('password');

// The reset link puts a recovery session in the URL fragment, which
// supabase-js picks up on load. Without one there is nothing to reset, so
// say so rather than showing a form that cannot work.
(async () => {
  if (!sb) return;
  try {
    const session = await getSession();
    if (!session) {
      say('err', 'This reset link has expired or has already been used. Please request a new one.');
      return;
    }
    form.style.display = 'block';
    pwField.focus();
  } catch (_) {
    say('err', friendlyError(''));
  }
})();

document.getElementById('pw-toggle').addEventListener('click', e => {
  const showing = pwField.type === 'text';
  pwField.type = showing ? 'password' : 'text';
  e.target.textContent = showing ? 'Show' : 'Hide';
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const password = pwField.value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8) { say('err', 'Choose a password of at least 8 characters.'); return; }
  if (password !== confirm) { say('err', 'Those two passwords are not the same.'); return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await sb.auth.updateUser({ password });
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Save new password';
    say('err', friendlyError(error.message));
    return;
  }

  // They chose this one themselves, so there is nothing left to force.
  try {
    const session = await getSession();
    if (session) await sb.from('profiles').update({ must_change_pw: false }).eq('id', session.user.id);
  } catch (_) {}

  await sb.auth.signOut();
  location.replace('/login.html?e=reset');
});

function say(kind, text) {
  msg.className = 'form-msg' + (kind ? ' ' + kind : '');
  msg.textContent = text;
  msg.style.display = text ? 'block' : 'none';
}
</script>
</body>
</html>
