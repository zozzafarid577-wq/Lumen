<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumen">
  <!-- The logo's own idea, cropped to the one letter that carries it:
       the underscored "u". No background plate — the mark sits on
       whatever is behind it, light or dark.

       It is drawn close to the edges of the canvas on purpose. A tab
       favicon is 16px, and every unit of padding here is lost at that
       size before the glyph is. -->
  <path d="M17 7v24a15 15 0 0 0 30 0V7" fill="none" stroke="#A2509F" stroke-width="9" stroke-linecap="round"/>
  <rect x="12" y="53" width="40" height="8" rx="4" fill="#A2509F"/>
</svg>
