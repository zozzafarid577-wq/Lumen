<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

      <span class="page-title">Flashcards</span>
    </div>
  </header>

  <main class="content">
    <div class="page-hero" id="hero"></div>
    <div id="decks"></div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;

// What a student knows of a deck lives on their device: which cards they
// sorted into Know and which into Still learning. Shared with the study
// page (flashcard.html), which writes it.
function deckState(deckId) {
  try { return JSON.parse(localStorage.getItem(`lumen_fc_${me.id}_${deckId}`) || '{}'); } catch (_) { return {}; }
}

(async () => {
  me = await requireAuth('student');
  if (!me) return;
  renderShell('student', me, { title: 'Flashcards' });

  const host = document.getElementById('decks');
  host.innerHTML = '<div class="skel" style="height:140px"></div>';
  const { data: decks, error } = await sb.from('flashcard_decks')
    .select('id, title, course_id, module_id, courses(title), modules(title, order_index), lessons(title), flashcards(id)')
    .eq('is_active', true).order('order_index').order('created_at');

  const course = (decks || [])[0]?.courses?.title || '';
  document.getElementById('hero').innerHTML = `
    <div class="crumbs"><a href="/portal/courses.html">My courses</a>${course ? `<span class="sep">›</span><span>${escHtml(course)}</span>` : ''}<span class="sep">›</span><span>Flashcards</span></div>
    <h1>${course ? `<span class="soft">${escHtml(course)}</span> ` : ''}Flashcards</h1>
    <p>Test yourself: read the front, say the answer, flip it. Sort each card into Know or Still learning, and come back to the ones you don't know yet.</p>`;

  const list = (decks || []).filter(d => (d.flashcards || []).length);
  if (error || !list.length) {
    host.innerHTML = `<div class="card"><div class="card-body">${emptyState('No flashcards yet', 'When your teacher adds a deck, it appears here.')}</div></div>`;
    return;
  }

  const groups = new Map();
  for (const d of list) {
    const key = d.module_id || 'all';
    if (!groups.has(key)) groups.set(key, { title: d.modules?.title || 'Whole course', order: d.modules ? d.modules.order_index : 1e9, decks: [] });
    groups.get(key).decks.push(d);
  }
  host.innerHTML = [...groups.values()].sort((a, b) => a.order - b.order).map(g => {
    const total = g.decks.reduce((n, d) => n + d.flashcards.length, 0);
    return `<section class="study-group">
      <div class="group-head"><h2>${escHtml(g.title)}</h2>
        <span class="chip">${g.decks.length} deck${g.decks.length === 1 ? '' : 's'}</span>
        <span class="chip sun">${total} card${total === 1 ? '' : 's'}</span></div>
      <div class="card-grid">${g.decks.map(deckCard).join('')}</div>
    </section>`;
  }).join('');
})();

function deckCard(d) {
  const n = d.flashcards.length;
  const ids = new Set(d.flashcards.map(c => c.id));
  const known = (deckState(d.id).known || []).filter(id => ids.has(id)).length;
  const pctKnown = n ? Math.round(known / n * 100) : 0;
  return `<a class="study-card" href="/portal/flashcard.html?deck=${d.id}" target="_blank" rel="noopener">
    <div class="sc-top"><div class="sc-title">${escHtml(d.title)}</div>
      <span class="sc-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></span></div>
    <div class="sc-meta">${escHtml([d.lessons?.title, `${n} card${n === 1 ? '' : 's'}`].filter(Boolean).join(' · '))}</div>
    <div class="sc-bar" aria-label="${known} of ${n} known"><span style="width:${pctKnown}%"></span></div>
    <div class="sc-status${known === n && n ? ' ok' : ''}">${known ? `${known} of ${n} known` : 'Not started'}</div>
    <span class="sc-btn${known ? ' again' : ''}">${known ? 'Keep going' : 'Study deck'}</span>
  </a>`;
}
</script>
