<script>
// A file uploaded to a lesson, shown on Lumen's own page.
//
// The file sits in the private lesson-media bucket. Opening its signed
// link directly works in a desktop browser, but not in the phone app:
// the app keeps storage links inside itself, and the Android web view
// cannot show a PDF — the student got a blank screen. So a PDF is drawn
// here, page by page, with PDF.js; pictures, audio and video use the
// page's own tags; Word, PowerPoint and Excel files go through
// Microsoft's online viewer. The material is read by its id, so the
// database decides who may see it, exactly as it does for the lesson.
const PDFJS = '/assets/vendor/pdfjs-4.10.38/';

function goBack() {
  if (history.length > 1) history.back();
  else location.href = '/portal/courses.html';
}

function fail(title, detail) {
  document.getElementById('f-body').innerHTML =
    `<div class="card"><div class="card-body">${emptyState(title, detail,
      '<a href="/portal/courses.html" class="btn btn-primary btn-sm">Back to my courses</a>')}</div></div>`;
}

(async () => {
  const me = await requireAuth();
  if (!me) return;
  // A teacher in "View as student" stays in it here, banner and all.
  let preview = false;
  try { preview = sessionStorage.getItem('lumen_preview') === '1'; } catch (_) {}
  if (me.role !== 'student' && preview) me.preview = true;
  renderShell(me.role === 'student' || me.preview ? 'student' : 'teacher', me, { title: 'File' });

  const id = new URLSearchParams(location.search).get('m');
  const { data: m } = id
    ? await sb.from('lesson_materials').select('id, title, file_url, kind').eq('id', id).maybeSingle()
    : { data: null };
  if (!m) { fail('This file is not available.', 'Its lesson may not be open yet, or it has been removed.'); return; }

  document.getElementById('f-title').textContent = m.title;
  document.title = `${m.title} | Lumen`;
  if (!isLessonFile(m.file_url)) { location.replace(m.file_url); return; }

  const path = m.file_url.slice(LESSON_FILE.length);
  const ext = (path.split('.').pop() || '').toLowerCase();
  const name = m.title + (ext && !m.title.toLowerCase().endsWith('.' + ext) ? '.' + ext : '');
  const [view, save] = await Promise.all([
    sb.storage.from('lesson-media').createSignedUrl(path, 3600),
    sb.storage.from('lesson-media').createSignedUrl(path, 3600, { download: name }),
  ]);
  if (view.error || !view.data?.signedUrl) { fail('We could not open this file.', 'Try again in a moment. If it keeps happening, let your teacher know.'); return; }
  const url = view.data.signedUrl;
  if (save.data?.signedUrl) {
    const dl = document.getElementById('f-download');
    dl.href = save.data.signedUrl;
    dl.style.display = '';
  }

  const body = document.getElementById('f-body');
  try {
    if (ext === 'pdf') await showPdf(body, url);
    else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) body.innerHTML = `<img class="file-img" src="${escHtml(url)}" alt="${escHtml(m.title)}">`;
    else if (['mp4', 'webm', 'm4v', 'mov'].includes(ext)) body.innerHTML = `<video class="file-media" src="${escHtml(url)}" controls playsinline preload="metadata"></video>`;
    else if (['mp3', 'm4a', 'wav', 'ogg'].includes(ext)) body.innerHTML = `<audio src="${escHtml(url)}" controls style="width:100%"></audio>`;
    else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) {
      body.innerHTML = `<iframe class="office-frame" title="${escHtml(m.title)}" src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}"></iframe>`;
    } else {
      body.innerHTML = `<div class="card"><div class="card-body">${emptyState('This file cannot be shown here', 'Use Download to open it on your device.')}</div></div>`;
    }
  } catch (err) {
    console.error('file view failed:', err);
    fail('We could not show this file.', 'Use Download to open it on your device instead.');
    document.getElementById('f-download').style.display = save.data?.signedUrl ? '' : 'none';
  }
})();

// Every page gets a box of the right shape at once, so the scroll bar is
// honest; a page is drawn when it comes near the screen, so a 60-page
// booklet does not hold up the first page or fill a phone's memory.
async function showPdf(body, url) {
  const pdfjs = await import(PDFJS + 'pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument({ url, isEvalSupported: false }).promise;

  body.innerHTML = '<div class="pdf-pages" id="pdf-pages"></div>';
  const host = document.getElementById('pdf-pages');
  const first = await doc.getPage(1);
  const ratio = first.getViewport({ scale: 1 }).height / first.getViewport({ scale: 1 }).width;

  const boxes = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const box = document.createElement('div');
    box.className = 'pdf-page';
    box.style.aspectRatio = `1 / ${ratio}`;
    box.dataset.n = n;
    host.appendChild(box);
    boxes.push(box);
  }

  const draw = async (box) => {
    if (box.dataset.drawn) return;
    box.dataset.drawn = '1';
    const page = await doc.getPage(Number(box.dataset.n));
    const base = page.getViewport({ scale: 1 });
    const scale = (box.clientWidth * Math.min(window.devicePixelRatio || 1, 2)) / base.width;
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    box.style.aspectRatio = `${vp.width} / ${vp.height}`;
    box.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  };

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); draw(e.target); } });
    }, { rootMargin: '600px 0px' });
    boxes.forEach(b => io.observe(b));
  } else {
    for (const b of boxes) await draw(b);
  }
}
</script>
