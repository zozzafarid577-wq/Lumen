<style>
  .exam-bar {
    position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 0 24px; height: 62px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  html[data-theme="dark"] .exam-bar { background: rgba(28,23,30,.94); }
  .exam-wrap { max-width: 820px; margin: 0 auto; padding: 26px 20px 80px; }
  .clock {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 1rem;
    font-variant-numeric: tabular-nums; padding: 7px 15px; border-radius: 9999px;
    background: var(--primary-soft); color: var(--primary);
  }
  .clock.low { background: #FCEDEF; color: var(--danger); animation: tick 1s steps(2) infinite; }
  @keyframes tick { 50% { opacity: .55; } }
  .q-block { border: 1px solid var(--border); border-radius: 8px; padding: 22px 24px; margin-bottom: 16px; background: var(--card); }
  .q-num { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .q-img { display: block; max-width: 100%; max-height: 420px; margin: -4px 0 16px; border-radius: 6px; border: 1px solid var(--border, #e5e7eb); background: #fff; }
  .q-text { font-size: .95rem; font-weight: 600; line-height: 1.55; margin-bottom: 16px; white-space: pre-line; }
  .q-opt {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 15px; margin-bottom: 9px;
    border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer;
    font-size: .87rem; line-height: 1.5; transition: border-color .15s, background .15s;
  }
  .q-opt:hover { border-color: var(--primary-line); }
  .q-opt input { margin-top: 3px; accent-color: var(--primary); width: 16px; height: 16px; flex-shrink: 0; }
  .q-opt.chosen { border-color: var(--primary); background: var(--primary-soft); }
  .q-opt.correct { border-color: var(--success); background: #E7F4EF; color: var(--success); font-weight: 600; }
  .q-opt.wrong   { border-color: var(--danger);  background: #FCEDEF; color: var(--danger); font-weight: 600; }
  .q-explain { font-size: .82rem; color: var(--text-2); background: var(--bg); border-radius: 6px; padding: 11px 14px; margin-top: 10px; line-height: 1.55; }
  .result-hero { text-align: center; padding: 40px 24px; }
  /* Free-response questions: one box per point, marked per point after. */
  .frq-part { margin-top: 14px; }
  .frq-part label { display: block; font-size: .86rem; font-weight: 600; line-height: 1.5; margin-bottom: 6px; white-space: pre-line; }
  .frq-part .frq-label { display: inline-block; min-width: 26px; padding: 1px 7px; margin-right: 6px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-size: .74rem; font-weight: 800; text-align: center; }
  .frq-part textarea { width: 100%; min-height: 96px; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 6px; font: inherit; font-size: .88rem; line-height: 1.55; resize: vertical; background: var(--card); color: inherit; }
  .frq-part textarea:focus { outline: none; border-color: var(--primary); }
  .frq-point { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-top: 10px; }
  .frq-point.earned { border-color: var(--success); background: #E7F4EF22; }
  .frq-point.missed { border-color: var(--danger); background: #FCEDEF33; }
  .frq-point .verdict { font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .frq-point.earned .verdict { color: var(--success); }
  .frq-point.missed .verdict { color: var(--danger); }
  .frq-point .their { font-size: .84rem; line-height: 1.55; white-space: pre-line; background: var(--bg); border-radius: 8px; padding: 8px 11px; margin: 8px 0; }
  .frq-point .guide { font-size: .8rem; color: var(--text-2); margin-top: 8px; padding: 9px 12px; border-radius: 8px;
                      background: var(--primary-soft); white-space: pre-line; line-height: 1.5; }
  .frq-point .guide b { display: block; color: var(--primary); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 3px; }

  /* FRQs sit on a soft tinted shelf of their own, apart from the plain
     multiple-choice cards. */
  .frq-zone { border-radius: 8px; padding: 16px; margin: 22px 0 14px;
              background: var(--primary-soft); border: 1px solid var(--primary-line); }
  .frq-zone .section-head { margin: 0 2px 12px; }
  .frq-zone .q-block:last-child { margin-bottom: 0; }
  .q-block.frq-q { padding: 0; overflow: hidden; }
  .frq-q .frq-band { padding: 10px 20px; color: var(--primary); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                     background: var(--primary-soft); border-bottom: 1px solid var(--primary-line); }
  .frq-q .frq-body { padding: 16px 20px 18px; }
  .result-pct { font-family: 'Manrope', sans-serif; font-size: 3.6rem; font-weight: 800; line-height: 1; letter-spacing: -.05em; }

  /* Exam mode: a mock exam sat the way the real one is — one question on
     screen, a flag for "come back to this", a sheet of every question in
     the section, and sections that close behind the student. */
  .sec-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
               font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .sec-strip .sec-name { color: var(--primary); }
  .q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .q-head .q-num { margin-bottom: 0; }
  .flag-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--border); background: var(--card); color: var(--text-2);
              border-radius: 999px; padding: 5px 12px; font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; }
  .flag-btn svg { width: 14px; height: 14px; }
  .flag-btn[aria-pressed="true"] { border-color: #E0A100; background: #FFF6DB; color: #8A6A00; }
  .exam-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin: 14px 0 6px; }
  .nav-cell { position: relative; height: 44px; border-radius: 8px; border: 1.5px dashed var(--border); background: var(--card);
              font: inherit; font-weight: 800; font-size: .86rem; color: var(--text-2); cursor: pointer; }
  .nav-cell.answered { border-style: solid; border-color: var(--primary-line); background: var(--primary-soft); color: var(--primary); }
  .nav-cell.current { outline: 2px solid var(--primary); outline-offset: 2px; }
  .nav-cell.flagged::after { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%;
                             background: #E0A100; border: 2px solid var(--card); }
  .nav-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--text-2); }
  .nav-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .flag-btn { white-space: nowrap; flex-shrink: 0; }
  /* A phone has room for the clock and one button: the sheet is a tap
     away under the section strip, and the course line can go. */
  @media (max-width: 600px) {
    .exam-bar { padding: 0 14px; }
    #sheet-btn, #t-sub { display: none !important; }
  }
</style>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;
let test = null;
let questions = [];
let answers = {};        // question id -> chosen option index
let startedAt = null;
let deadline = null;     // epoch ms, or null when there is no time limit
let ticker = null;
let submitted = false;
let lastRow = null;       // the handed-in paper, with its marking once the server has marked it

// Exam mode (mock exams only). The paper is sat in sections, one question
// on screen at a time; `cur` is that question's place in the whole paper.
let exam = false;
let sections = [];        // [{ from, to, minutes }] — question indexes, `to` not included
let sec = 0;              // the section being sat; the ones before it are closed
let secStartedAt = null;  // when this section's clock started
let cur = 0;
let flags = new Set();    // question ids the student wants to come back to

(async () => {
  me = await requireAuth('student');
  if (!me) return;

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { fail('No test was named.', 'Go back to your tests and pick one.'); return; }

  const { data, error } = await sb.from('practice_tests').select('*, courses(title)').eq('id', id).maybeSingle();
  if (error) { fail('We could not load that test.', friendlyError(error.message)); return; }
  if (!data)  { fail('That test is not available.', 'It may have been taken down, or it belongs to another course.'); return; }
  test = data;
  if (test.is_offline) { fail('This test was done in class.', 'Your mark for it is on your scores page.'); return; }

  const w = testWindow(test);
  if (!w.open) { fail('This test is not open.', w.label); return; }

  // Before a test opens the database refuses its questions outright, so
  // an empty list here means something is wrong with the test itself
  // rather than with this student.
  const { data: qs, error: qErr } = await sb.from('test_questions')
    .select('*')
    .eq('test_id', id).order('order_index');
  if (qErr) { fail('We could not load the questions.', friendlyError(qErr.message)); return; }
  if (!qs?.length) { fail('This test has no questions yet.', 'Let your teacher know.'); return; }
  questions = qs;

  startedAt = Date.now();
  exam = test.kind === 'mock';
  sections = examSections();
  // Answers kept from an earlier visit — a closed tab, a dropped phone
  // connection, a page refreshed by accident. The clock carries on from
  // when they first started, so leaving does not buy extra time.
  const draft = readDraft();
  if (draft) {
    answers = draft.answers;
    startedAt = draft.startedAt || startedAt;
    if (exam) {
      flags = new Set(draft.flags);
      sec = Math.min(draft.sec, sections.length - 1);
      secStartedAt = draft.secStartedAt;
      cur = draft.cur;
    }
  }
  if (exam) {
    secStartedAt = secStartedAt || startedAt;
    if (cur < sections[sec].from || cur >= sections[sec].to) cur = sections[sec].from;
  }
  startClock();

  document.getElementById('t-title').textContent = test.title;
  document.getElementById('t-sub').textContent =
    [test.courses?.title, `${questions.length} question${questions.length === 1 ? '' : 's'}`,
     `pass mark ${passMarks(test.passing_score_pct, questions.reduce((t, q) => t + (q.points || 1), 0))}`].filter(Boolean).join(' · ');
  document.getElementById('submit-btn').style.display = 'inline-flex';
  if (exam) document.getElementById('sheet-btn').style.display = 'inline-flex';
  saveDraft();

  renderQuestions();
  if (draft) {
    restoreTicks();
    const n = Object.keys(answers).length;
    if (n) showToast(`Welcome back — your ${n} answer${n === 1 ? ' is' : 's are'} still here.`, 'success');
  }
  window.addEventListener('beforeunload', warnOnLeave);
})();

// ── Answers kept on the device until the test is handed in ─────────
// Saved on every tick, read back when the test is opened again, cleared
// once it is handed in. Kept on this device only; a student who starts
// on a phone and opens the test on a laptop starts that copy afresh.
// Only answers to questions still on the test are restored, so a test
// the teacher has edited in between cannot mark a different question.
function draftKey() { return `lumen_test_draft:${me.id}:${test.id}`; }

function readDraft() {
  if (me.preview) return null;
  try {
    const d = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if (!d || typeof d.answers !== 'object') return null;
    if (Date.now() - (d.savedAt || 0) > 14 * 864e5) { localStorage.removeItem(draftKey()); return null; }
    const ids = new Set(questions.map(q => q.id));
    const kept = {};
    for (const [qid, v] of Object.entries(d.answers)) if (ids.has(qid)) kept[qid] = v;
    return {
      answers: kept, startedAt: Number(d.startedAt) || null,
      flags: Array.isArray(d.flags) ? d.flags.filter(id => ids.has(id)) : [],
      sec: Number.isInteger(d.sec) && d.sec >= 0 ? d.sec : 0,
      secStartedAt: Number(d.secStartedAt) || null,
      cur: Number.isInteger(d.cur) && d.cur >= 0 && d.cur < questions.length ? d.cur : 0,
    };
  } catch (_) { return null; }
}

function saveDraft() {
  if (me.preview || submitted) return;
  try {
    localStorage.setItem(draftKey(), JSON.stringify({
      answers, startedAt, savedAt: Date.now(),
      ...(exam ? { flags: [...flags], sec, secStartedAt, cur } : {}),
    }));
  } catch (_) { /* storage full or blocked: the test still works, it just will not survive a reload */ }
}

function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch (_) {}
}

function restoreTicks() {
  for (const [qid, v] of Object.entries(answers)) {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      document.querySelectorAll(`textarea[data-q="${qid}"]`).forEach(t => { t.value = v[t.dataset.l] || ''; });
      continue;
    }
    const chosen = Array.isArray(v) ? v : [v];
    document.querySelectorAll(`.q-opt[data-q="${qid}"]`).forEach(label => {
      const on = chosen.includes(Number(label.dataset.i));
      label.querySelector('input').checked = on;
      label.classList.toggle('chosen', on);
    });
  }
  updateCount();
}

// The answers are kept on the device, but a student closing the tab
// usually means to come back — so still ask, as a nudge to hand in. The
// browser shows its own wording; all we control is that it asks at all.
function warnOnLeave(e) {
  if (submitted) return;
  e.preventDefault();
  e.returnValue = '';
}

function tick() {
  const left = Math.max(0, deadline - Date.now());
  const mins = Math.floor(left / 60000);
  const secs = Math.floor((left % 60000) / 1000);
  const clock = document.getElementById('clock');
  clock.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  clock.classList.toggle('low', left < 120000);

  // Time up: hand in what they have rather than throwing it away. A
  // half-finished test scored is worth more than nothing recorded. In a
  // sectioned exam that closes the section and opens the next one.
  if (left <= 0) {
    clearInterval(ticker);
    if (exam && sec < sections.length - 1) {
      showToast(`Time is up for section ${sec + 1} — on to section ${sec + 2}.`, 'info');
      nextSection();
      return;
    }
    showToast('Time is up — handing in what you have.', 'info');
    submitTest(true);
  }
}

// The clock for the test, or in exam mode for the section being sat.
function startClock() {
  clearInterval(ticker);
  const minutes = exam ? sections[sec].minutes : test.time_limit_min;
  if (!minutes) { document.getElementById('clock').style.display = 'none'; return; }
  deadline = (exam ? secStartedAt : startedAt) + minutes * 60000;
  document.getElementById('clock').style.display = 'inline-flex';
  ticker = setInterval(tick, 1000);
  tick();
}

// ── Exam mode ─────────────────────────────────────────────────────
// How the paper is split. The teacher's sections are used only while
// they still add up to the questions on the paper; a test edited since
// falls back to one section on the paper's own time limit, so no
// question is ever out of reach.
function examSections() {
  const set = Array.isArray(test.exam_sections) ? test.exam_sections : [];
  const total = set.reduce((t, x) => t + (Number(x.questions) || 0), 0);
  if (set.length > 1 && total === questions.length) {
    let from = 0;
    return set.map(x => {
      const part = { from, to: from + Number(x.questions), minutes: Number(x.minutes) || null };
      from = part.to;
      return part;
    });
  }
  return [{ from: 0, to: questions.length, minutes: test.time_limit_min || null }];
}

function isAnswered(q) { return answers[q.id] != null; }

function goTo(i) {
  const s = sections[sec];
  cur = Math.max(s.from, Math.min(s.to - 1, i));
  saveDraft();
  renderQuestions();
  window.scrollTo({ top: 0 });
}

function toggleFlag(qid) {
  if (flags.has(qid)) flags.delete(qid); else flags.add(qid);
  saveDraft();
  const btn = document.getElementById('flag-btn');
  if (btn) {
    const on = flags.has(qid);
    btn.setAttribute('aria-pressed', String(on));
    btn.lastChild.textContent = on ? 'Flagged' : 'Flag for review';
  }
}

function openSheet() {
  const s = sections[sec];
  const qs = questions.slice(s.from, s.to);
  document.getElementById('sheet-title').textContent = sections.length > 1
    ? `Section ${sec + 1} of ${sections.length} · questions ${s.from + 1}–${s.to}` : 'All questions';
  document.getElementById('sheet-grid').innerHTML = qs.map((q, k) => {
    const i = s.from + k;
    const cls = [isAnswered(q) && 'answered', flags.has(q.id) && 'flagged', i === cur && 'current'].filter(Boolean).join(' ');
    const state = [isAnswered(q) ? 'answered' : 'not answered', flags.has(q.id) && 'flagged'].filter(Boolean).join(', ');
    return `<button type="button" class="nav-cell ${cls}" onclick="closeModal('sheet'); goTo(${i})" aria-label="Question ${i + 1}, ${state}">${i + 1}</button>`;
  }).join('');
  const done = qs.filter(isAnswered).length;
  const flagged = qs.filter(q => flags.has(q.id)).length;
  document.getElementById('sheet-count').textContent =
    `${done} of ${qs.length} answered${flagged ? ` · ${flagged} flagged` : ''}`;
  document.getElementById('sheet-finish').textContent = finishLabel();
  openModal('sheet');
}

function finishLabel() {
  return exam && sec < sections.length - 1 ? `Hand in section ${sec + 1}` : 'Hand in the exam';
}

// The top button and the sheet's: closes the section, or hands in the
// paper from the last one. A section closes for good, so say what is
// still open in it before it goes.
function handIn() {
  if (!exam || sec === sections.length - 1) { submitTest(); return; }
  const s = sections[sec];
  const qs = questions.slice(s.from, s.to);
  const blank = qs.filter(q => !isAnswered(q)).length;
  const flagged = qs.filter(q => flags.has(q.id)).length;
  const open = [blank && `${blank} unanswered`, flagged && `${flagged} flagged`].filter(Boolean).join(' and ');
  if (!confirm(`Hand in section ${sec + 1}?${open ? ` You still have ${open}.` : ''} You cannot come back to this section.`)) return;
  nextSection();
}

function nextSection() {
  sec += 1;
  secStartedAt = Date.now();
  cur = sections[sec].from;
  saveDraft();
  startClock();
  renderQuestions();
  window.scrollTo({ top: 0 });
  showToast(`Section ${sec + 1} of ${sections.length} has started.`, 'info');
}

// How many options a question marks as right. More than one — the
// synonym and antonym questions in a language paper, where two of five
// words are the answer — makes it a tick-several question rather than a
// pick-one. Nothing on the question says which kind it is; the number of
// correct options is the only thing that has to be true, so it is what
// this reads.
function rightAnswers(q) {
  return (q.options || []).map((o, j) => (o.correct ? j : -1)).filter(j => j >= 0);
}
function isMulti(q) { return rightAnswers(q).length > 1; }

// A free-response question: written answers, one per point, marked by
// the server against the official scoring guideline (api/_lib/frq.js).
function isFrq(q) { return q.kind === 'frq'; }
function frqPoints(q) { return q.frq?.points || []; }
const answerKey = (p) => p.group || p.label;
// The boxes the student writes in: one per point, except a part scored
// 0–2, which is one box worth two points.
function frqBoxes(q) {
  const boxes = new Map();
  for (const p of frqPoints(q)) {
    const k = answerKey(p);
    if (!boxes.has(k)) boxes.set(k, { key: k, prompt: p.prompt, worth: 0 });
    boxes.get(k).worth++;
  }
  return [...boxes.values()];
}

// A student who put one answer to a two-answer question has answered it,
// so `answers` holds an array for those and a plain number for the rest.
// Attempts done before today are all plain numbers and still read back.
function chosenFor(qid) {
  const given = answers[qid];
  if (given == null) return [];
  return Array.isArray(given) ? given : [given];
}

// All of them and none of the others. No part marks: on a two-from-five
// question they would let a student tick all five and still score,
// which is not knowing the answer. The mark and the review both ask
// this, so a question cannot score and still be listed as wrong.
function gotRight(q) {
  const chosen = chosenFor(q.id);
  const right = rightAnswers(q);
  return chosen.length === right.length && right.every(j => chosen.includes(j));
}

// A figure the question refers to: a graph, a brain diagram, a chart.
function qImage(q) {
  return q.image_url ? `<img class="q-img" src="${escHtml(q.image_url)}" alt="Figure for this question" loading="lazy">` : '';
}

function frqBlock(q, i) {
  const given = answers[q.id] || {};
  return `
    <div class="q-block frq-q" id="q-${q.id}">
      <div class="frq-band"${exam ? ' style="display:flex;align-items:center;justify-content:space-between;gap:10px"' : ''}><span>Question ${i + 1} of ${questions.length} · FRQ · ${frqPoints(q).length} points</span>${exam ? flagButton(q) : ''}</div>
      <div class="frq-body">
      <div class="q-text" style="font-weight:500">${escHtml(q.question_text)}</div>
      ${qImage(q)}
      ${frqBoxes(q).map(b => `
        <div class="frq-part">
          <label for="a-${q.id}-${escHtml(b.key)}"><span class="frq-label">${escHtml(b.key)}</span>${escHtml(b.prompt)}${b.worth > 1 ? ` <span class="muted">(${b.worth} points)</span>` : ''}</label>
          <textarea id="a-${q.id}-${escHtml(b.key)}" data-q="${q.id}" data-l="${escHtml(b.key)}" placeholder="Write your answer in full sentences.">${escHtml(given[b.key] || '')}</textarea>
        </div>`).join('')}
      </div>
    </div>`;
}

function questionHtml(q, i) {
  if (isFrq(q)) return frqBlock(q, i);
  const multi = isMulti(q);
  const num = `<div class="q-num">Question ${i + 1} of ${questions.length}${q.points > 1 ? ` · ${q.points} marks` : ''}</div>`;
  return `
    <div class="q-block" id="q-${q.id}">
      ${exam ? `<div class="q-head">${num}${flagButton(q)}</div>` : num}
      <div class="q-text">${escHtml(q.question_text)}</div>
      ${qImage(q)}
      ${multi ? `<p class="small muted" style="margin:-4px 0 10px">Choose ${rightAnswers(q).length} answers — you only score if you get all of them and nothing else.</p>` : ''}
      ${(q.options || []).map((o, j) => `
        <label class="q-opt" data-q="${q.id}" data-i="${j}">
          <input type="${multi ? 'checkbox' : 'radio'}" name="q-${q.id}" value="${j}">
          <span>${escHtml(o.text)}</span>
        </label>`).join('')}
    </div>`;
}

function flagButton(q) {
  const on = flags.has(q.id);
  return `<button type="button" class="flag-btn" id="flag-btn" aria-pressed="${on}" onclick="toggleFlag('${q.id}')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg><span>${on ? 'Flagged' : 'Flag for review'}</span></button>`;
}

// One question on screen, with Back and Next inside its section. The
// last question's Next opens the sheet, so the student sees what is
// still blank or flagged before handing the section in.
function examHtml() {
  const s = sections[sec];
  const q = questions[cur];
  const last = cur === s.to - 1;
  return `
    <div class="sec-strip">
      <span>${sections.length > 1 ? `<span class="sec-name">Section ${sec + 1} of ${sections.length}</span> · ` : ''}Question ${cur - s.from + 1} of ${s.to - s.from}</span>
      <button type="button" class="btn btn-ghost btn-sm" onclick="openSheet()">See all questions</button>
    </div>
    ${questionHtml(q, cur)}
    <div class="exam-nav">
      <button class="btn btn-outline" onclick="goTo(${cur - 1})" ${cur === s.from ? 'disabled' : ''}>Back</button>
      ${last
        ? `<button class="btn btn-primary" onclick="openSheet()">Review and hand in</button>`
        : `<button class="btn btn-primary" onclick="goTo(${cur + 1})">Next</button>`}
    </div>
    <p class="small muted" style="margin-top:14px;text-align:center" id="answered-count"></p>`;
}

function renderQuestions() {
  document.getElementById('submit-btn').textContent = exam ? finishLabel() : 'Hand in';
  document.getElementById('wrap').innerHTML = exam ? examHtml() : questions.map((q, i) => questionHtml(q, i)).join('') + `
    <div style="text-align:center;margin-top:24px">
      <button class="btn btn-primary btn-lg" onclick="submitTest()">Hand in my answers</button>
      <p class="small muted" style="margin-top:12px" id="answered-count"></p>
    </div>`;

  // On the input's own change rather than the label's click: the input
  // sits inside the label, so a click has already toggled a checkbox by
  // the time a click handler runs, and toggling it again in code would
  // undo the student's tick.
  document.querySelectorAll('textarea[data-q]').forEach(box => {
    box.addEventListener('input', () => {
      const qid = box.dataset.q;
      const now = { ...(answers[qid] || {}) };
      if (box.value.trim()) now[box.dataset.l] = box.value; else delete now[box.dataset.l];
      if (Object.keys(now).length) answers[qid] = now; else delete answers[qid];
      updateCount();
      saveDraft();
    });
  });

  document.querySelectorAll('.q-opt input').forEach(input => {
    input.addEventListener('change', () => {
      const qid = input.closest('.q-opt').dataset.q;
      const q = questions.find(x => x.id === qid);
      const inputs = [...document.querySelectorAll(`.q-opt[data-q="${qid}"] input`)];
      const picked = inputs.map((el, j) => (el.checked ? j : -1)).filter(j => j >= 0);

      if (isMulti(q)) {
        // Unticking the last box leaves the question unanswered rather
        // than answered with nothing, so the count below stays honest.
        if (picked.length) answers[qid] = picked; else delete answers[qid];
      } else {
        answers[qid] = picked[0];
      }

      inputs.forEach(el => el.closest('.q-opt').classList.toggle('chosen', el.checked));
      updateCount();
      saveDraft();
    });
  });
  // Only the question on screen exists in exam mode, so it is filled in
  // from the answers each time it is drawn.
  if (exam) restoreTicks(); else updateCount();
}

function updateCount() {
  const el = document.getElementById('answered-count');
  if (!el) return;
  const pool = exam ? questions.slice(sections[sec].from, sections[sec].to) : questions;
  const n = pool.filter(isAnswered).length;
  el.textContent = `${n} of ${pool.length} answered${exam && sections.length > 1 ? ' in this section' : ''}${n < pool.length ? ' — unanswered questions score zero.' : ''}`;
}

async function submitTest(auto = false) {
  if (submitted) return;

  const unanswered = questions.length - Object.keys(answers).length;
  if (!auto && unanswered > 0 &&
      !confirm(`${unanswered} question${unanswered === 1 ? ' is' : 's are'} still unanswered and will score zero. Hand in anyway?`)) {
    return;
  }

  submitted = true;
  clearInterval(ticker);
  window.removeEventListener('beforeunload', warnOnLeave);
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('clock').style.display = 'none';
  document.getElementById('sheet-btn').style.display = 'none';

  // Marked here so the student sees their result at once; the same
  // numbers are stored, and the teacher sees exactly these. Written
  // answers count nothing until the server has marked them, just below.
  let score = 0, maxScore = 0;
  questions.forEach(q => {
    const points = q.points || 1;
    maxScore += points;
    if (!isFrq(q) && gotRight(q)) score += points;
  });
  const hasFrq = questions.some(isFrq);
  const percentage = maxScore ? Math.round((score / maxScore) * 10000) / 100 : 0;
  const passed = percentage >= test.passing_score_pct;

  const row = {
    teacher_id: me.teacher_id,
    student_id: me.id,
    test_id: test.id,
    answers,
    score,
    max_score: maxScore,
    percentage,
    passed,
    time_taken_sec: Math.round((Date.now() - startedAt) / 1000),
    started_at: new Date(startedAt).toISOString(),
    completed_at: new Date().toISOString(),
    ...(hasFrq ? { grading: { status: 'pending' } } : {}),
  };

  // Student view: the teacher sees the result screen a student would, and
  // nothing goes to the database or to a parent.
  if (me.preview) {
    if (hasFrq) {
      showMarking();
      try { Object.assign(row, await apiPost('/api/support', { flow: 'frq-grade', test_id: test.id, answers })); }
      catch (err) { row.gradeError = err.message; }
    }
    showResult(row, { saved: true });
    showToast('Student view — this result was not saved.', 'info');
    return;
  }

  const outcome = await save(row);
  // Saved, or kept on the device to be sent again: either way the draft
  // has done its job.
  clearDraft();
  // Written answers are marked now, against the scoring guideline. If
  // that fails the paper is still handed in; the teacher marks it from
  // the results page.
  if (hasFrq && outcome.saved && outcome.id) {
    showMarking();
    try { Object.assign(row, await apiPost('/api/support', { flow: 'frq-grade', attempt_id: outcome.id })); }
    catch (err) { row.gradeError = err.message; }
  }
  showResult(row, outcome);

  // Only once the mark is actually in the database. Telling a parent a
  // score their teacher cannot see would be worse than telling them
  // nothing — the offline copy is re-sent on the next page load, and the
  // email follows it then.
  if (outcome.saved) notifyParent(row.test_id);
}

// Fire and forget. A parent who does not get the email still has a
// child whose result is saved; blocking the results page on a mail
// provider would be the wrong way round.
function notifyParent(testId) {
  apiPost('/api/result-email', { test_id: testId })
    .catch(err => console.warn('Result email not sent:', err.message));
}

// A finished test must not be lost to a lapsed token or a dropped
// connection. Refresh the session first, and if the write still fails,
// keep the row on the device — auth.js re-sends it on the next page load
// with a working session.
async function save(row) {
  try {
    const session = await ensureFreshSession();
    if (!session) throw new Error('no session');
    const { data, error } = await sb.from('test_attempts').insert(row).select('id').single();
    if (error) throw error;
    return { saved: true, id: data?.id };
  } catch (_) {
    const kept = savePendingAttempt(row);
    return { saved: false, kept };
  }
}

function showMarking() {
  document.getElementById('wrap').innerHTML = `<div class="card"><div class="card-body" style="text-align:center;padding:48px 24px">
    <div class="skel" style="height:10px;max-width:240px;margin:0 auto 18px"></div>
    <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:1.05rem">Marking your written answers…</div>
    <p class="small muted" style="margin-top:8px">Each part is checked against the official AP scoring guidelines. This takes up to a minute — please keep this page open.</p>
  </div></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResult(row, outcome) {
  lastRow = row;
  const pending = row.grading?.status !== 'graded' && questions.some(isFrq);
  const notice = row.gradeError || (pending && outcome.saved)
    ? `<div class="alert alert-info mb24"><div>Your written answers are handed in. <strong>Your teacher will mark them</strong> against the official scoring guidelines, and your mark will update on your scores page. Until then the mark below counts only the multiple-choice questions.${row.grading?.status === 'awaiting_teacher' ? ' Check your answers against the guidelines below while you wait.' : ''}</div></div>`
    : outcome.saved ? ''
    : outcome.kept
      ? `<div class="alert alert-warning mb24"><div>Your connection dropped, so this result has not reached your teacher yet. It is safe on this device and will be sent automatically next time you open Lumen — <strong>on this same device and browser</strong>.</div></div>`
      : `<div class="alert alert-error mb24"><div>We could not save this result and this browser would not let us keep a copy. Please screenshot this page and send it to your teacher.</div></div>`;

  document.getElementById('wrap').innerHTML = `
    ${notice}
    <div class="card mb24 printable">
      <div class="result-hero">
        <div class="result-pct" style="color:${pending ? 'var(--muted)' : row.passed ? 'var(--success)' : 'var(--danger)'}">${pending && !questions.some(q => !isFrq(q)) ? 'Handed in' : marks(row.score, row.max_score)}</div>
        <div style="font-family:Manrope,sans-serif;font-size:1.05rem;font-weight:800;margin:12px 0 6px">
          ${pending ? 'Waiting for your written answers to be marked' : row.passed ? 'Passed' : 'Not passed this time'}
        </div>
        <p class="small muted">${row.score} out of ${row.max_score} marks · pass mark ${passMarks(test.passing_score_pct, row.max_score)} · ${Math.round(row.time_taken_sec / 60)} min</p>
        <div class="row" style="justify-content:center;margin-top:20px">
          <a href="/portal/scores.html" class="btn btn-outline btn-sm">My scores</a>
          <a href="/portal/courses.html" class="btn btn-primary btn-sm">Back to my courses</a>
        </div>
      </div>
    </div>

    ${reviewSection()}`;

  document.getElementById('leave-btn').textContent = 'Done';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Only what went wrong. A student who got forty-six of fifty has four
// things to look at, and scrolling past the forty-six to find them is
// how the four get skipped. A blank counts as wrong: it scored zero and
// they still need the answer. Each keeps the number it had in the test,
// so "question 31" means the same thing here as it did to the teacher.
function reviewSection() {
  return frqReview() + mcqReview();
}

// Every free-response question, point by point: what they wrote, earned
// or not and why, and the guideline the point was marked against.
function frqReview() {
  const frqs = questions.map((q, i) => ({ q, i })).filter(({ q }) => isFrq(q));
  const status = lastRow?.grading?.status;
  if (!frqs.length || !['graded', 'awaiting_teacher'].includes(status)) return '';
  const marked = status === 'graded';
  return `<div class="frq-zone">
    <div class="section-head"><div><h2>Your FRQ answers</h2><div class="sub">${marked ? 'Marked point by point against the official AP scoring guidelines' : 'Next to the official AP scoring guideline for each point — your teacher will mark them'}</div></div></div>
    ${frqs.map(({ q, i }) => {
      const points = new Map((lastRow.grading.questions?.[q.id]?.points || []).map(p => [p.label, p]));
      const rules = new Map((lastRow.guidelines?.[q.id]?.points || []).map(p => [p.label, p.rubric]));
      const got = frqPoints(q).filter(p => points.get(p.label)?.earned).length;
      return `<div class="q-block">
        <div class="q-num">Question ${i + 1}${marked ? ` · ${got} of ${frqPoints(q).length} points` : ` · ${frqPoints(q).length} points`}</div>
        ${frqPoints(q).map(p => {
          const m = points.get(p.label) || {};
          const theirs = (answers[q.id] || {})[answerKey(p)];
          return `<div class="frq-point ${marked ? (m.earned ? 'earned' : 'missed') : ''}">
            <div class="verdict">${escHtml(p.label)}${marked ? ` · ${m.earned ? 'Point earned' : 'No point'}` : ''}</div>
            <div class="small" style="margin-top:4px;white-space:pre-line">${escHtml(p.prompt)}</div>
            <div class="their">${theirs ? escHtml(theirs) : '<span class="muted">Left blank</span>'}</div>
            ${m.reason ? `<div class="small">${escHtml(m.reason)}</div>` : ''}
            ${rules.get(p.label) ? `<div class="guide"><b>What the scoring guideline asks for</b>${escHtml(rules.get(p.label))}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function mcqReview() {
  if (!questions.some(q => !isFrq(q))) return '';
  const missed = questions.map((q, i) => ({ q, i })).filter(({ q }) => !isFrq(q) && !gotRight(q));
  if (!missed.length) {
    return `<div class="card"><div class="card-body">${emptyState('Nothing to go over',
      `You got all the multiple-choice questions right.`)}</div></div>`;
  }
  return `
    <div class="section-head"><div><h2>What you got wrong</h2><div class="sub">${missed.length} of ${questions.length} question${questions.length === 1 ? '' : 's'} — what you put, and what was right</div></div></div>
    ${missed.map(({ q, i }) => reviewBlock(q, i)).join('')}`;
}

function reviewBlock(q, i) {
  const chosen = chosenFor(q.id);
  return `<div class="q-block">
    <div class="q-num">Question ${i + 1}</div>
    <div class="q-text">${escHtml(q.question_text)}</div>
    ${qImage(q)}
    ${(q.options || []).map((o, j) => {
      const isChosen = chosen.includes(j);
      const cls = o.correct ? ' correct' : (isChosen ? ' wrong' : '');
      // On a two-answer question the student needs to see which of the
      // right ones they found, not just which ones were right.
      const tag = o.correct ? (isChosen ? ' ✓ you put this' : ' ✓') : (isChosen ? ' ← you put this' : '');
      return `<div class="q-opt${cls}"><span>${escHtml(o.text)}${tag}</span></div>`;
    }).join('')}
    ${!chosen.length ? '<p class="small muted" style="margin-top:8px">You left this one blank.</p>' : ''}
    ${q.explanation ? `<div class="q-explain">${escHtml(q.explanation)}</div>` : ''}
  </div>`;
}

function fail(title, detail) {
  document.getElementById('t-title').textContent = 'Test';
  document.getElementById('wrap').innerHTML =
    `<div class="card"><div class="card-body">${emptyState(title, detail,
      '<a href="/portal/courses.html" class="btn btn-primary btn-sm">Back to my courses</a>')}</div></div>`;
}
</script>
</body>
</html>
