<style>
  .exam-bar {
    position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.94); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 0 24px; height: 62px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  html[data-theme="dark"] .exam-bar { background: rgba(28,23,30,.94); }
  .exam-wrap { max-width: 820px; margin: 0 auto; padding: 26px 20px 80px; }
  .clock {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 1rem;
    font-variant-numeric: tabular-nums; padding: 7px 15px; border-radius: 9999px;
    background: var(--primary-soft); color: var(--primary);
  }
  .clock.low { background: #FCEDEF; color: var(--danger); animation: tick 1s steps(2) infinite; }
  @keyframes tick { 50% { opacity: .55; } }
  .q-block { border: 1px solid var(--border); border-radius: 15px; padding: 22px 24px; margin-bottom: 16px; background: var(--card); }
  .q-num { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .q-text { font-size: .95rem; font-weight: 600; line-height: 1.55; margin-bottom: 16px; }
  .q-opt {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 15px; margin-bottom: 9px;
    border: 1.5px solid var(--border); border-radius: 11px; cursor: pointer;
    font-size: .87rem; line-height: 1.5; transition: border-color .15s, background .15s;
  }
  .q-opt:hover { border-color: var(--primary-line); }
  .q-opt input { margin-top: 3px; accent-color: var(--primary); width: 16px; height: 16px; flex-shrink: 0; }
  .q-opt.chosen { border-color: var(--primary); background: var(--primary-soft); }
  .q-opt.correct { border-color: var(--success); background: #E7F4EF; color: var(--success); font-weight: 600; }
  .q-opt.wrong   { border-color: var(--danger);  background: #FCEDEF; color: var(--danger); font-weight: 600; }
  .q-explain { font-size: .82rem; color: var(--text-2); background: var(--bg); border-radius: 10px; padding: 11px 14px; margin-top: 10px; line-height: 1.55; }
  .result-hero { text-align: center; padding: 40px 24px; }
  .result-pct { font-family: 'Manrope', sans-serif; font-size: 3.6rem; font-weight: 800; line-height: 1; letter-spacing: -.05em; }
</style>
</head>
<body>

<div class="exam-bar">
  <div style="min-width:0">
    <div style="font-size:.9rem;font-weight:800;font-family:Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="t-title">Loading…</div>
    <div class="small muted" id="t-sub"></div>
  </div>
  <div class="row" style="flex-wrap:nowrap">
    <span class="clock" id="clock" style="display:none">--:--</span>
    <button class="btn btn-primary btn-sm" id="submit-btn" onclick="submitTest()" style="display:none">Hand in</button>
    <a href="/portal/courses.html" class="btn btn-ghost btn-sm" id="leave-btn">Leave</a>
  </div>
</div>

<div class="exam-wrap" id="wrap">
  <div class="skel" style="height:120px;margin-bottom:16px"></div>
  <div class="skel" style="height:120px"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;
let test = null;
let questions = [];
let answers = {};        // question id -> chosen option index
let startedAt = null;
let deadline = null;     // epoch ms, or null when there is no time limit
let ticker = null;
let submitted = false;

(async () => {
  me = await requireAuth('student');
  if (!me) return;

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { fail('No test was named.', 'Go back to your tests and pick one.'); return; }

  const { data, error } = await sb.from('practice_tests').select('*, courses(title)').eq('id', id).maybeSingle();
  if (error) { fail('We could not load that test.', friendlyError(error.message)); return; }
  if (!data)  { fail('That test is not available.', 'It may have been taken down, or it belongs to another course.'); return; }
  test = data;

  const w = testWindow(test);
  if (!w.open) { fail('This test is not open.', w.label); return; }

  // Before a test opens the database refuses its questions outright, so
  // an empty list here means something is wrong with the test itself
  // rather than with this student.
  const { data: qs, error: qErr } = await sb.from('test_questions')
    .select('id, question_text, options, explanation, points, order_index')
    .eq('test_id', id).order('order_index');
  if (qErr) { fail('We could not load the questions.', friendlyError(qErr.message)); return; }
  if (!qs?.length) { fail('This test has no questions yet.', 'Let your teacher know.'); return; }
  questions = qs;

  startedAt = Date.now();
  if (test.time_limit_min) {
    deadline = startedAt + test.time_limit_min * 60000;
    document.getElementById('clock').style.display = 'inline-flex';
    ticker = setInterval(tick, 1000);
    tick();
  }

  document.getElementById('t-title').textContent = test.title;
  document.getElementById('t-sub').textContent =
    [test.courses?.title, `${questions.length} question${questions.length === 1 ? '' : 's'}`,
     `pass at ${test.passing_score_pct}%`].filter(Boolean).join(' · ');
  document.getElementById('submit-btn').style.display = 'inline-flex';

  renderQuestions();
  window.addEventListener('beforeunload', warnOnLeave);
})();

// Closing the tab mid-test loses the answers, so say so. The browser
// shows its own wording; all we control is that it asks at all.
function warnOnLeave(e) {
  if (submitted) return;
  e.preventDefault();
  e.returnValue = '';
}

function tick() {
  const left = Math.max(0, deadline - Date.now());
  const mins = Math.floor(left / 60000);
  const secs = Math.floor((left % 60000) / 1000);
  const clock = document.getElementById('clock');
  clock.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  clock.classList.toggle('low', left < 120000);

  // Time up: hand in what they have rather than throwing it away. A
  // half-finished test scored is worth more than nothing recorded.
  if (left <= 0) {
    clearInterval(ticker);
    showToast('Time is up — handing in what you have.', 'info');
    submitTest(true);
  }
}

// How many options a question marks as right. More than one — the
// synonym and antonym questions in a language paper, where two of five
// words are the answer — makes it a tick-several question rather than a
// pick-one. Nothing on the question says which kind it is; the number of
// correct options is the only thing that has to be true, so it is what
// this reads.
function rightAnswers(q) {
  return (q.options || []).map((o, j) => (o.correct ? j : -1)).filter(j => j >= 0);
}
function isMulti(q) { return rightAnswers(q).length > 1; }

// A student who put one answer to a two-answer question has answered it,
// so `answers` holds an array for those and a plain number for the rest.
// Attempts done before today are all plain numbers and still read back.
function chosenFor(qid) {
  const given = answers[qid];
  if (given == null) return [];
  return Array.isArray(given) ? given : [given];
}

// All of them and none of the others. No part marks: on a two-from-five
// question they would let a student tick all five and still score,
// which is not knowing the answer. The mark and the review both ask
// this, so a question cannot score and still be listed as wrong.
function gotRight(q) {
  const chosen = chosenFor(q.id);
  const right = rightAnswers(q);
  return chosen.length === right.length && right.every(j => chosen.includes(j));
}

function renderQuestions() {
  document.getElementById('wrap').innerHTML = questions.map((q, i) => {
    const multi = isMulti(q);
    return `
    <div class="q-block" id="q-${q.id}">
      <div class="q-num">Question ${i + 1} of ${questions.length}${q.points > 1 ? ` · ${q.points} marks` : ''}</div>
      <div class="q-text">${escHtml(q.question_text)}</div>
      ${multi ? `<p class="small muted" style="margin:-4px 0 10px">Choose ${rightAnswers(q).length} answers — you only score if you get all of them and nothing else.</p>` : ''}
      ${(q.options || []).map((o, j) => `
        <label class="q-opt" data-q="${q.id}" data-i="${j}">
          <input type="${multi ? 'checkbox' : 'radio'}" name="q-${q.id}" value="${j}">
          <span>${escHtml(o.text)}</span>
        </label>`).join('')}
    </div>`;
  }).join('') + `
    <div style="text-align:center;margin-top:24px">
      <button class="btn btn-primary btn-lg" onclick="submitTest()">Hand in my answers</button>
      <p class="small muted" style="margin-top:12px" id="answered-count"></p>
    </div>`;

  // On the input's own change rather than the label's click: the input
  // sits inside the label, so a click has already toggled a checkbox by
  // the time a click handler runs, and toggling it again in code would
  // undo the student's tick.
  document.querySelectorAll('.q-opt input').forEach(input => {
    input.addEventListener('change', () => {
      const qid = input.closest('.q-opt').dataset.q;
      const q = questions.find(x => x.id === qid);
      const inputs = [...document.querySelectorAll(`.q-opt[data-q="${qid}"] input`)];
      const picked = inputs.map((el, j) => (el.checked ? j : -1)).filter(j => j >= 0);

      if (isMulti(q)) {
        // Unticking the last box leaves the question unanswered rather
        // than answered with nothing, so the count below stays honest.
        if (picked.length) answers[qid] = picked; else delete answers[qid];
      } else {
        answers[qid] = picked[0];
      }

      inputs.forEach(el => el.closest('.q-opt').classList.toggle('chosen', el.checked));
      updateCount();
    });
  });
  updateCount();
}

function updateCount() {
  const n = Object.keys(answers).length;
  document.getElementById('answered-count').textContent =
    `${n} of ${questions.length} answered${n < questions.length ? ' — unanswered questions score zero.' : ''}`;
}

async function submitTest(auto = false) {
  if (submitted) return;

  const unanswered = questions.length - Object.keys(answers).length;
  if (!auto && unanswered > 0 &&
      !confirm(`${unanswered} question${unanswered === 1 ? ' is' : 's are'} still unanswered and will score zero. Hand in anyway?`)) {
    return;
  }

  submitted = true;
  clearInterval(ticker);
  window.removeEventListener('beforeunload', warnOnLeave);
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('clock').style.display = 'none';

  // Marked here so the student sees their result at once; the same
  // numbers are stored, and the teacher sees exactly these.
  let score = 0, maxScore = 0;
  questions.forEach(q => {
    const points = q.points || 1;
    maxScore += points;
    if (gotRight(q)) score += points;
  });
  const percentage = maxScore ? Math.round((score / maxScore) * 10000) / 100 : 0;
  const passed = percentage >= test.passing_score_pct;

  const row = {
    teacher_id: me.teacher_id,
    student_id: me.id,
    test_id: test.id,
    answers,
    score,
    max_score: maxScore,
    percentage,
    passed,
    time_taken_sec: Math.round((Date.now() - startedAt) / 1000),
    started_at: new Date(startedAt).toISOString(),
    completed_at: new Date().toISOString(),
  };

  const outcome = await save(row);
  showResult(row, outcome);

  // Only once the mark is actually in the database. Telling a parent a
  // score their teacher cannot see would be worse than telling them
  // nothing — the offline copy is re-sent on the next page load, and the
  // email follows it then.
  if (outcome.saved) notifyParent(row.test_id);
}

// Fire and forget. A parent who does not get the email still has a
// child whose result is saved; blocking the results page on a mail
// provider would be the wrong way round.
function notifyParent(testId) {
  apiPost('/api/result-email', { test_id: testId })
    .catch(err => console.warn('Result email not sent:', err.message));
}

// A finished test must not be lost to a lapsed token or a dropped
// connection. Refresh the session first, and if the write still fails,
// keep the row on the device — auth.js re-sends it on the next page load
// with a working session.
async function save(row) {
  try {
    const session = await ensureFreshSession();
    if (!session) throw new Error('no session');
    const { error } = await sb.from('test_attempts').insert(row);
    if (error) throw error;
    return { saved: true };
  } catch (_) {
    const kept = savePendingAttempt(row);
    return { saved: false, kept };
  }
}

function showResult(row, outcome) {
  const notice = outcome.saved ? ''
    : outcome.kept
      ? `<div class="alert alert-warning mb24"><div>Your connection dropped, so this result has not reached your teacher yet. It is safe on this device and will be sent automatically next time you open Lumen — <strong>on this same device and browser</strong>.</div></div>`
      : `<div class="alert alert-error mb24"><div>We could not save this result and this browser would not let us keep a copy. Please screenshot this page and send it to your teacher.</div></div>`;

  document.getElementById('wrap').innerHTML = `
    ${notice}
    <div class="card mb24 printable">
      <div class="result-hero">
        <div class="result-pct" style="color:${row.passed ? 'var(--success)' : 'var(--danger)'}">${row.percentage}%</div>
        <div style="font-family:Manrope,sans-serif;font-size:1.05rem;font-weight:800;margin:12px 0 6px">
          ${row.passed ? 'Passed' : 'Not passed this time'}
        </div>
        <p class="small muted">${row.score} of ${row.max_score} marks · pass mark ${test.passing_score_pct}% · ${Math.round(row.time_taken_sec / 60)} min</p>
        <div class="row" style="justify-content:center;margin-top:20px">
          <a href="/portal/scores.html" class="btn btn-outline btn-sm">My scores</a>
          <a href="/portal/courses.html" class="btn btn-primary btn-sm">Back to my courses</a>
        </div>
      </div>
    </div>

    ${reviewSection()}`;

  document.getElementById('leave-btn').textContent = 'Done';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Only what went wrong. A student who got forty-six of fifty has four
// things to look at, and scrolling past the forty-six to find them is
// how the four get skipped. A blank counts as wrong: it scored zero and
// they still need the answer. Each keeps the number it had in the test,
// so "question 31" means the same thing here as it did to the teacher.
function reviewSection() {
  const missed = questions.map((q, i) => ({ q, i })).filter(({ q }) => !gotRight(q));
  if (!missed.length) {
    return `<div class="card"><div class="card-body">${emptyState('Nothing to go over',
      `You got all ${questions.length} question${questions.length === 1 ? '' : 's'} right.`)}</div></div>`;
  }
  return `
    <div class="section-head"><div><h2>What you got wrong</h2><div class="sub">${missed.length} of ${questions.length} question${questions.length === 1 ? '' : 's'} — what you put, and what was right</div></div></div>
    ${missed.map(({ q, i }) => reviewBlock(q, i)).join('')}`;
}

function reviewBlock(q, i) {
  const chosen = chosenFor(q.id);
  return `<div class="q-block">
    <div class="q-num">Question ${i + 1}</div>
    <div class="q-text">${escHtml(q.question_text)}</div>
    ${(q.options || []).map((o, j) => {
      const isChosen = chosen.includes(j);
      const cls = o.correct ? ' correct' : (isChosen ? ' wrong' : '');
      // On a two-answer question the student needs to see which of the
      // right ones they found, not just which ones were right.
      const tag = o.correct ? (isChosen ? ' ✓ you put this' : ' ✓') : (isChosen ? ' ← you put this' : '');
      return `<div class="q-opt${cls}"><span>${escHtml(o.text)}${tag}</span></div>`;
    }).join('')}
    ${!chosen.length ? '<p class="small muted" style="margin-top:8px">You left this one blank.</p>' : ''}
    ${q.explanation ? `<div class="q-explain">${escHtml(q.explanation)}</div>` : ''}
  </div>`;
}

function fail(title, detail) {
  document.getElementById('t-title').textContent = 'Test';
  document.getElementById('wrap').innerHTML =
    `<div class="card"><div class="card-body">${emptyState(title, detail,
      '<a href="/portal/courses.html" class="btn btn-primary btn-sm">Back to my courses</a>')}</div></div>`;
}
</script>
</body>
</html>
