<style>
  .chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: .9rem; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.them { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .bubble-meta { font-size: .66rem; opacity: .72; margin-top: 3px; text-align: right; }
  .bubble.them .bubble-meta { text-align: left; }
  .day-sep { align-self: center; font-size: .7rem; color: var(--muted); font-weight: 700; margin: 10px 0 4px; }
  .chat-send { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--border); align-items: flex-end; background: var(--card); }
  .chat-send textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; }
  .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: .86rem; max-width: 300px; line-height: 1.5; }
</style>
<style>
  .chat-card { display: flex; flex-direction: column; height: calc(100vh - var(--top) - 56px); height: calc(100dvh - var(--top) - 56px); min-height: 420px; overflow: hidden; }
  @media (max-width: 900px) { .chat-card { height: calc(100dvh - var(--top) - 32px); } }
</style>

<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">Messages</span>
    </div>
  </header>

  <main class="content" style="max-width:820px">
    <div class="card chat-card">
      <div class="card-header">
        <span class="card-title">Your teacher · <span data-tenant-name>Lumen</span></span>
      </div>
      <div class="chat-log" id="log"><div class="skel" style="height:90px"></div></div>
      <form class="chat-send" id="send-form" onsubmit="event.preventDefault();send()">
        <textarea class="form-textarea" id="msg" rows="1" maxlength="4000" placeholder="Write to your teacher…" aria-label="Your message"></textarea>
        <button class="btn btn-primary" id="send-btn" type="submit">Send</button>
      </form>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
// One conversation: this student and their teacher (and any assistant
// answering for them). Rows are read and written under RLS — a student
// can only ever see and add to their own conversation.
let me = null;
let msgs = [];

// ── Shared by both Messages pages ─────────────────────────────────
function chatHtml(list, mine) {
  if (!list.length) return '';
  let day = '';
  const lastMine = [...list].reverse().find(m => mine(m));
  return list.map(m => {
    const d = new Date(m.created_at);
    const label = d.toDateString() === new Date().toDateString() ? 'Today' : fmtDate(m.created_at);
    const sep = label !== day ? `<div class="day-sep">${escHtml(label)}</div>` : '';
    day = label;
    const time = d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
    const seen = m === lastMine && m.read_at ? ' · Seen' : '';
    return `${sep}<div class="bubble ${mine(m) ? 'me' : 'them'}" dir="auto">${escHtml(m.body)}<div class="bubble-meta">${time}${seen}</div></div>`;
  }).join('');
}

function scrollToEnd() {
  const log = document.getElementById('log');
  log.scrollTop = log.scrollHeight;
}

// Enter sends; Shift+Enter is a new line. The box grows with what is typed.
function wireComposer(onSend) {
  const box = document.getElementById('msg');
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); onSend(); }
  });
  box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 140) + 'px'; });
}

function noTableYet(error) {
  return /messages|relation|schema cache/i.test(error?.message || '');
}

(async () => {
  me = await requireAuth('student');
  if (!me) return;
  renderShell('student', me, { title: 'Messages' });
  wireComposer(send);
  if (me.preview) {
    document.getElementById('log').innerHTML = '<div class="chat-empty">Your students write to you here, and your replies appear on this page. Answer them from <strong>Messages</strong> in your own menu.</div>';
    document.getElementById('msg').disabled = true;
    document.getElementById('send-btn').disabled = true;
    return;
  }
  await load();

  window.addEventListener('lumen:message', (e) => {
    const m = e.detail;
    if (!m || m.student_id !== me.id || msgs.some(x => x.id === m.id)) return;
    msgs.push(m);
    draw();
    markRead();
  });
  setInterval(() => { if (!document.hidden) load(true); }, 20000);
})();

async function load(quiet) {
  const { data, error } = await sb.from('messages')
    .select('id, student_id, body, from_staff, created_at, read_at')
    .eq('student_id', me.id).order('created_at', { ascending: false }).limit(300);
  if (error) {
    if (!quiet) document.getElementById('log').innerHTML = `<div class="chat-empty">${noTableYet(error)
      ? 'Messages are not switched on for your class yet.' : escHtml(friendlyError(error.message))}</div>`;
    return;
  }
  const before = msgs.length;
  msgs = data.reverse();
  if (!quiet || msgs.length !== before) draw();
  markRead();
}

function draw() {
  const log = document.getElementById('log');
  log.innerHTML = msgs.length
    ? chatHtml(msgs, m => !m.from_staff)
    : '<div class="chat-empty">Stuck on something, or need to tell your teacher anything? Write it here — they will reply on this page.</div>';
  scrollToEnd();
}

function markRead() {
  if (!msgs.some(m => m.from_staff && !m.read_at)) return;
  sb.rpc('mark_messages_read', { p_student: me.id }).then(({ error }) => {
    if (error) return;
    msgs.forEach(m => { if (m.from_staff && !m.read_at) m.read_at = new Date().toISOString(); });
    setMessagesCount(0);
  });
}

async function send() {
  const box = document.getElementById('msg');
  const body = box.value.trim();
  if (!body || me.preview) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  const { data, error } = await sb.from('messages').insert({
    teacher_id: me.teacher_id, student_id: me.id, sender_id: me.id, from_staff: false, body,
  }).select('id, student_id, body, from_staff, created_at, read_at').single();
  btn.disabled = false;
  if (error) { showToast(noTableYet(error) ? 'Messages are not switched on yet.' : friendlyError(error.message), 'error'); return; }
  box.value = ''; box.style.height = '';
  if (!msgs.some(x => x.id === data.id)) msgs.push(data);
  draw();
  pushMessage(data.id);
  box.focus();
}
</script>
</body>
