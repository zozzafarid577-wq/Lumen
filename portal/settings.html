<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/portal.css">
<script>try{if(localStorage.getItem('lumen_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">Settings</span>
    </div>
  </header>

  <main class="content" style="max-width:700px">

    <div class="alert alert-warning mb24" id="first-notice" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div>Welcome! Your teacher set your first password, so they know it. Choose your own before you start.</div>
    </div>

    <div class="card mb24">
      <div class="card-header"><span class="card-title">Password</span></div>
      <div class="card-body">
        <div class="alert alert-error" id="pw-alert" style="display:none;margin-bottom:16px"></div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pw1">New password</label>
            <input type="password" class="form-input" id="pw1" autocomplete="new-password" placeholder="At least 8 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="pw2">Type it again</label>
            <input type="password" class="form-input" id="pw2" autocomplete="new-password">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="pw-save" onclick="savePassword()">Change password</button>
      </div>
    </div>

    <div class="card mb24">
      <div class="card-header"><span class="card-title">Your details</span></div>
      <div class="card-body">
        <div class="alert alert-error" id="me-alert" style="display:none;margin-bottom:16px"></div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="me-name">Full name</label>
            <input type="text" class="form-input" id="me-name">
          </div>
          <div class="form-group">
            <label class="form-label" for="me-phone">Phone</label>
            <input type="tel" class="form-input" id="me-phone">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="me-email">Email</label>
          <input type="email" class="form-input" id="me-email" disabled>
          <p class="form-hint">This is what you sign in with. Ask your teacher if it needs changing.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="me-save" onclick="saveMe()">Save details</button>
      </div>
    </div>

    <div class="card mb24">
      <div class="card-header"><span class="card-title">Your teacher</span></div>
      <div class="card-body" id="teacher-box"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Session</span></div>
      <div class="card-body">
        <p class="small muted mb16">Signing out ends this session on this device only.</p>
        <button class="btn btn-outline btn-sm" onclick="signOut()">Sign out</button>
      </div>
    </div>

  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null;

(async () => {
  me = await requireAuth('student');
  if (!me) return;
  renderShell('student', me, { title: 'Settings' });

  if (new URLSearchParams(location.search).get('first') === '1' || me.must_change_pw) {
    document.getElementById('first-notice').style.display = 'flex';
    document.getElementById('pw1').focus();
  }

  document.getElementById('me-name').value = me.full_name || '';
  document.getElementById('me-phone').value = me.phone || '';
  document.getElementById('me-email').value = me.email || '';

  const t = me.teacher;
  document.getElementById('teacher-box').innerHTML = t ? `
    <div style="font-family:Manrope,sans-serif;font-size:1.05rem;font-weight:800">${escHtml(t.display_name)}</div>
    <div class="small muted" style="margin-top:3px">${escHtml(t.subject || '')}${t.tagline ? ' · ' + escHtml(t.tagline) : ''}</div>
    ${t.bio ? `<p class="small" style="margin-top:12px;line-height:1.6">${escHtml(t.bio)}</p>` : ''}
    <div class="row" style="margin-top:14px">
      ${t.whatsapp ? `<a href="https://wa.me/${escHtml(t.whatsapp)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Message on WhatsApp</a>` : ''}
      ${t.contact_email ? `<a href="mailto:${escHtml(t.contact_email)}" class="btn btn-ghost btn-sm">${escHtml(t.contact_email)}</a>` : ''}
    </div>` : '<p class="small muted">—</p>';
})();

async function savePassword() {
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  if (p1.length < 8) { say('pw-alert', 'Choose a password of at least 8 characters.'); return; }
  if (p1 !== p2) { say('pw-alert', 'Those two passwords are not the same.'); return; }

  const btn = document.getElementById('pw-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) {
    say('pw-alert', friendlyError(error.message));
    btn.disabled = false;
    btn.textContent = 'Change password';
    return;
  }

  await sb.from('profiles').update({ must_change_pw: false }).eq('id', me.id);
  me.must_change_pw = false;

  document.getElementById('pw1').value = '';
  document.getElementById('pw2').value = '';
  document.getElementById('first-notice').style.display = 'none';
  say('pw-alert', '');
  btn.disabled = false;
  btn.textContent = 'Change password';
  showToast('Password changed.', 'success');

  if (new URLSearchParams(location.search).get('first') === '1') {
    setTimeout(() => location.replace('/portal/'), 900);
  }
}

async function saveMe() {
  const btn = document.getElementById('me-save');
  btn.disabled = true;
  const { error } = await sb.from('profiles').update({
    full_name: document.getElementById('me-name').value.trim() || me.full_name,
    phone: document.getElementById('me-phone').value.trim() || null,
  }).eq('id', me.id);
  btn.disabled = false;

  if (error) { say('me-alert', friendlyError(error.message)); return; }
  say('me-alert', '');
  showToast('Saved.', 'success');
  setTimeout(() => location.reload(), 700);
}

function say(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? 'flex' : 'none';
}
</script>
</body>
</html>
