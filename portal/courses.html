<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My courses | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/portal.css">
<script>try{if(localStorage.getItem('lumen_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  /* ── The hello ────────────────────────────────────────────────
     There is no student dashboard in front of this page, so the top of
     it does that job: their own name, their own course, and how far
     through it they are. Flat brand purple rather than the dark gradient
     the teacher's side wears — this is the front of the brand. */
  .welcome-banner {
    background: var(--primary);
    border-radius: 0; margin: 0; padding: 0; min-height: 218px;
    display: flex; align-items: center;
  }
  .welcome-banner::before, .welcome-banner::after { display: none; }
  /* The same column the units sit in, so "Hi ..." starts where they do. */
  .hero-inner { width: 100%; max-width: 1240px; margin: 0 auto; padding: 40px 28px; }
  @media (max-width: 768px) { .welcome-banner { min-height: 0; } .hero-inner { padding: 28px 16px; } }

  /* What they are studying, said once at the top. A student with two
     courses open needs to see at a glance which one this is. */
  .hero-kicker {
    font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(255,255,255,.7); margin-bottom: 12px; position: relative; z-index: 1;
  }

  .hero-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
  .hero-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.16);
    color: #fff; border-radius: 9999px; padding: 6px 13px;
    font-size: .73rem; font-weight: 600; white-space: nowrap;
  }
  .hero-chip svg { width: 13px; height: 13px; opacity: .85; }
  .hero-prog { margin-top: 18px; max-width: 320px; position: relative; z-index: 1; }
  .hero-bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .hero-fill { height: 100%; border-radius: 4px; background: #fff; transition: width .8s cubic-bezier(.4,0,.2,1); }
  .hero-prog-label { font-size: .71rem; color: rgba(255,255,255,.72); margin-top: 7px; font-weight: 500; }

  /* The greeting itself, said big. A student's own name and their own
     course, at a size that reads as a welcome rather than a header —
     this page is the whole of their Lumen, so it opens on them. */
  .hero-hi {
    font-family: 'Manrope', sans-serif; font-weight: 800; color: #fff;
    font-size: clamp(1.6rem, 4.6vw, 2.9rem); line-height: 1.16;
    letter-spacing: -.03em; position: relative; z-index: 1; max-width: 22ch;
  }
  .hero-hi .thin { font-weight: 700; opacity: .92; }
  /* The sparkle. Big, cropped by the banner's own overflow, and behind
     everything else so a long course title runs straight over it. */
  .hero-spark {
    position: absolute; right: -14px; top: 50%; transform: translateY(-50%);
    width: 210px; height: 210px; color: #FFD24A; opacity: .95;
    pointer-events: none; z-index: 0;
  }
  /* On a phone the greeting fills the banner, so the sparkle steps back
     to being a texture behind it rather than a shape beside it. */
  @media (max-width: 700px) {
    .hero-spark { width: 120px; height: 120px; right: -30px; opacity: .5; }
  }

  /* ── The units, with their name down the side ────────────────── */
  .courses-rail { display: flex; align-items: stretch; gap: 18px; }
  .rail-label { display: flex; align-items: flex-start; gap: 12px; flex-shrink: 0; padding-top: 4px; }
  /* The purple line the label sits against. It runs the height of the
     list, so the units read as one group rather than three cards. */
  .rail-label::after {
    content: ''; width: 3px; border-radius: 2px; background: var(--primary);
    opacity: .55; align-self: stretch;
  }
  .rail-label span {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 1.6rem;
    letter-spacing: -.01em; color: var(--primary); white-space: nowrap;
  }
  /* On a phone the label costs width the units need more, so it lies
     down above them instead of standing beside them. */
  @media (max-width: 700px) {
    .courses-rail { flex-direction: column; gap: 10px; }
    .rail-label { padding-top: 0; }
    .rail-label::after { display: none; }
    .rail-label span { writing-mode: horizontal-tb; transform: none; font-size: 1.25rem; }
  }

  /* ── How to use this page ─────────────────────────────────────
     Only drawn when the teacher has actually recorded something. */
  .help-panel {
    background: var(--primary-soft); border: 1px solid var(--primary-line);
    border-radius: 20px; padding: 24px 26px; margin-top: 26px;
  }
  .help-panel h2 {
    font-family: 'Manrope', sans-serif; font-weight: 800; color: var(--primary);
    font-size: 1.25rem; letter-spacing: -.02em; margin-bottom: 16px;
  }
  .help-video {
    position: relative; width: 100%; max-width: 560px; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; background: #1B1519;
    border: 1px solid var(--primary-line);
  }
  .help-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ── A unit ───────────────────────────────────────────────────
     Numbered, because "Unit 3" is how a student and their teacher
     talk about it, and the number is what they scan the page for. */
  .unit {
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px;
    overflow: hidden; background: var(--card); box-shadow: var(--shadow-xs);
    transition: box-shadow .22s, border-color .22s;
    animation: rise .38s cubic-bezier(.4,0,.2,1) both;
  }
  .unit:hover { box-shadow: var(--shadow-sm); }
  .unit.is-open:hover { border-color: var(--primary-line); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .unit { animation: none; } }

  /* The whole head is the handle. `list-style:none` in both spellings —
     Safari still wants the -webkit- one — or the browser draws its own
     triangle next to ours. */
  .unit-summary { cursor: pointer; list-style: none; }
  .unit-summary::-webkit-details-marker { display: none; }
  .unit-summary:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .unit-head { padding: 16px 20px; background: var(--bg); display: flex; align-items: center; gap: 14px; }
  .unit-summary:hover .unit-head { background: var(--primary-soft); }
  .unit-chev { display: flex; color: var(--muted); transition: transform .22s cubic-bezier(.4,0,.2,1); }
  .unit-chev svg { width: 18px; height: 18px; }
  .unit[open] .unit-chev { transform: rotate(180deg); }
  .unit-num {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', sans-serif; font-size: 1rem; font-weight: 800; color: #fff;
    background: linear-gradient(140deg, var(--primary) 0%, var(--primary-hover) 100%);
    box-shadow: var(--shadow-brand);
  }
  /* A unit that has not opened wears a padlock instead of its number:
     the number promises a place to go, and there is not one yet. */
  .unit-num.locked {
    background: var(--border); color: var(--muted); box-shadow: none;
  }
  .unit-num.locked svg { width: 18px; height: 18px; }
  .unit-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: .95rem; letter-spacing: -.01em; }
  .unit-bar { height: 4px; background: var(--border); }
  .unit-bar span { display: block; height: 100%; background: var(--primary); transition: width .7s cubic-bezier(.4,0,.2,1); }
  .locked-card { padding: 26px 20px; text-align: center; color: var(--muted); font-size: .84rem; }
  .locked-card .lock-big { display: block; width: 22px; height: 22px; margin: 0 auto 9px; opacity: .55; }
  .unit-tests { padding: 11px 20px 5px; font-size: .68rem; font-weight: 700; text-transform: uppercase;
                letter-spacing: .1em; color: var(--muted); border-top: 1px solid var(--border); background: var(--bg); }

  /* ── The rows inside it ───────────────────────────────────────
     Anything that belongs to one lesson — its handouts and its papers —
     is stepped in under it, and tinted by what it is, so a unit can be
     read at a glance rather than word by word. */
  .list-row { transition: background .15s; }
  .list-row:hover { background: var(--bg); }
  .list-row.under { padding-left: 48px; background: var(--bg); }
  .list-row.under::before {
    content: ''; position: absolute; left: 32px; top: 0; bottom: 0;
    width: 2px; background: var(--border); border-radius: 1px;
  }
  .list-row.under { position: relative; }
  .list-row.under:hover { background: var(--primary-soft); }
  .lr-ic.ic-doc  { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
  .lr-ic.ic-test { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
  .lr-done .lr-ic { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .lr-done .lr-title { color: var(--text-2); }

  .unit-meta { flex: 1; min-width: 0; }
  .practise-btn { display: inline-flex; align-items: center; gap: 6px; }
  .practise-btn svg { width: 13px; height: 13px; }

  /* On a phone the title, the tally and the button cannot share a line
     without the title being squeezed into one word per row. The number
     and the title keep the first line; everything else drops below. */
  @media (max-width: 700px) {
    .unit-head { flex-wrap: wrap; row-gap: 10px; }
    .unit-meta { flex: 1 1 60%; }
    .unit-head .badge { margin-left: 56px; }
    .unit-head .badge + .practise-btn, .unit-head .badge ~ .btn { margin-left: auto; }
    .hero-chip { font-size: .7rem; padding: 5px 11px; }
  }
</style>
</head>
<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">My courses</span>
    </div>
    <div class="topbar-right">
      <select class="form-select" id="course-pick" style="max-width:240px;display:none" aria-label="Choose a course"></select>
    </div>
  </header>

  <!-- Outside <main>, so the purple runs edge to edge. Its own contents
       are held to the same width as the content below, so the greeting
       still lines up with the units. -->
  <div id="course-card"></div>

  <main class="content">
    <!-- The units, with their own name written down the side of them.
         The label is decoration, not information, so it is hidden from
         anything that reads the page aloud. -->
    <div class="courses-rail">
      <div class="rail-label" aria-hidden="true"><span>your courses</span></div>
      <div id="units" style="flex:1;min-width:0"><div class="skel" style="height:120px;margin-bottom:16px"></div><div class="skel" style="height:120px"></div></div>
    </div>
    <div id="help-panel"></div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/assets/vendor/supabase-2.117.0.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>

<script src="/js/shell.js"></script>
<script>
// This is the whole of a student's course: the units their teacher has
// opened, the handouts on each lesson, and the papers set on them. There
// is no separate lessons or tests page to go looking at — a student
// opens their course and everything in it is on the page.
let me = null;
let courses = [];
let doneIds = new Set();
let bestByTest = new Map();   // test_id -> the student's best attempt
let practiceByUnit = {};      // module_id -> how many bank questions to practise
let practiceFetchedFor = null;
let dueByTest = new Map();   // test_id -> the deadline set to this student
// Which units the student has opened. Ticking a lesson off redraws the
// whole page, and a unit that shut itself because they marked something
// done inside it would be maddening.
const expanded = new Set();

function rememberUnit(id, open) {
  if (open) expanded.add(id); else expanded.delete(id);
}

(async () => {
  me = await requireAuth('student');
  if (!me) return;
  renderShell('student', me, { title: 'My courses' });

  // The group comes along with the enrolment: which sitting of this
  // course they attend is part of what the course is, to them.
  const { data: enrolments } = await sb.from('enrollments')
    .select('expires_at, groups(name, days, start_time), courses(id, title, subject, description, exam_date, order_index)')
    .eq('student_id', me.id);

  // In the order their teacher put them in, not alphabetically: a
  // teacher who drags Senior 1 above Senior 2 means it for the student
  // as well as for themselves.
  courses = (enrolments || []).map(e => ({ ...e.courses, expires_at: e.expires_at, group: e.groups }))
    .filter(c => c?.id)
    .sort((a, b) => (a.order_index ?? 0) - (b.order_index ?? 0) || a.title.localeCompare(b.title));

  if (!courses.length) {
    document.getElementById('units').innerHTML =
      `<div class="card"><div class="card-body">${emptyState('No courses yet',
        'Your teacher has not enrolled you on anything yet. Once they do, your units, handouts and tests all appear here.')}</div></div>`;
    return;
  }

  // One course is not a choice, so it is not offered as one.
  const pick = document.getElementById('course-pick');
  if (courses.length > 1) {
    pick.innerHTML = courses.map(c => `<option value="${c.id}">${escHtml(c.title)}</option>`).join('');
    pick.style.display = '';
    pick.addEventListener('change', () => {
      history.replaceState(null, '', '?course=' + pick.value);   // so a reload stays put
      load();
    });
  } else {
    pick.innerHTML = `<option value="${courses[0].id}"></option>`;
  }

  const wanted = new URLSearchParams(location.search).get('course');
  if (wanted && courses.some(c => c.id === wanted)) pick.value = wanted;

  const { data: done } = await sb.from('lesson_completions').select('lesson_id').eq('student_id', me.id);
  doneIds = new Set((done || []).map(d => d.lesson_id));

  // Their own marks, so a test already done shows what they got rather
  // than inviting them to do it again as if it were new.
  const { data: attempts } = await sb.from('test_attempts')
    .select('test_id, percentage, passed, completed_at')
    .eq('student_id', me.id).not('completed_at', 'is', null);
  (attempts || []).forEach(a => {
    const p = parseFloat(a.percentage);
    if (isNaN(p)) return;
    const cur = bestByTest.get(a.test_id);
    if (!cur || p > parseFloat(cur.percentage)) bestByTest.set(a.test_id, a);
  });

  await load();
})();

async function load() {
  const courseId = document.getElementById('course-pick').value;
  const course = courses.find(c => c.id === courseId);
  const host = document.getElementById('units');
  host.innerHTML = '<div class="skel" style="height:120px"></div>';

  // The lessons inside a unit that has not been released are not
  // returned at all — the database refuses them, not this page. So an
  // empty `lessons` array on a closed unit is the expected shape, and
  // the lock below is a label on that, not the lock itself.
  const [{ data, error }, { data: tests }, { data: setForMe }] = await Promise.all([
    sb.from('modules')
      .select('*, lessons(*, lesson_materials(id, title, file_url, kind))')
      .eq('course_id', courseId).order('order_index'),
    // A test's questions are locked until it opens, but the test itself
    // is worth seeing early: a student should know a paper is coming on
    // the lesson they are reading.
    sb.from('practice_tests').select('*, test_sections(name, color)')
      .eq('course_id', courseId).eq('is_active', true).order('order_index').order('created_at'),
    // The deadlines set to this student — to their whole course, or to
    // the group they attend. The database only returns the ones that
    // apply to them, so anything that arrives here is theirs.
    sb.from('test_assignments').select('test_id, due_at').eq('course_id', courseId),
  ]);

  if (error) { host.innerHTML = `<div class="card"><div class="card-body">${escHtml(friendlyError(error.message))}</div></div>`; return; }

  // The earliest deadline wins if a test is set both to the whole course
  // and to their group: the sooner one is the one they have to meet.
  dueByTest = new Map();
  (setForMe || []).forEach(a => {
    if (!a.due_at) return;
    const seen = dueByTest.get(a.test_id);
    if (!seen || a.due_at < seen) dueByTest.set(a.test_id, a.due_at);
  });

  const units = data || [];
  const visible = units.filter(u => u.is_done || u.open_at);   // drafts stay out of sight entirely
  const openUnits = visible.filter(u => moduleOpen(u));

  // Filed by where the teacher put it: on a lesson, on a unit, or on
  // nothing in particular. The last kind used to live on a separate Tests
  // page; it now sits at the foot of the course, which is the only place
  // left for it to be found.
  const byLesson = new Map();
  const byUnit = new Map();
  const placed = new Set();
  const lessonIds = new Set();
  openUnits.forEach(u => (u.lessons || []).forEach(l => lessonIds.add(l.id)));

  const file = (map, key, t) => {
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(t);
    placed.add(t.id);
  };
  (tests || []).forEach(t => {
    if (t.lesson_id && lessonIds.has(t.lesson_id)) return file(byLesson, t.lesson_id, t);
    if (t.module_id && openUnits.some(u => u.id === t.module_id)) return file(byUnit, t.module_id, t);
  });

  // A paper that belongs to no open unit is not shown at all. The course
  // page is the units and what hangs off them; a catch-all card at the
  // foot of it read as a second, unexplained list. Filing a test under a
  // unit and lesson in the builder is what puts it in front of a student.
  const homeless = (tests || []).filter(t => !placed.has(t.id)).length;
  if (homeless) {
    console.info(`${homeless} test(s) on this course are not filed under an open unit, so they are not shown.`);
  }

  // Which units have bank questions behind them. The bank is closed to
  // students, so this is a count from the server, not a query — asked
  // once per course, since ticking a lesson off redraws this whole page.
  // A failure here costs the Practice buttons and nothing else.
  if (practiceFetchedFor !== courseId) {
    practiceFetchedFor = courseId;
    try {
      const { units: counts } = await apiPost('/api/practice', { action: 'available', course_id: courseId });
      practiceByUnit = counts || {};
    } catch (_) { practiceByUnit = {}; }
  }

  // What the banner counts as waiting: open right now, and not yet done.
  const now = new Date();
  const toSit = (tests || []).filter(t =>
    placed.has(t.id) && testWindow(t, now).open && !bestByTest.has(t.id)).length;

  drawCourseCard(course, visible, toSit);
  drawUnits(host, visible, byUnit, byLesson);
}

// The hello. A student opening this page should be met by their own
// name and the state of their course, not by a list — so the counts that
// would otherwise be scattered down the page are gathered here.
function drawCourseCard(c, units, openTests) {
  const open = units.filter(u => moduleOpen(u));
  const all = open.flatMap(u => u.lessons || []);
  const done = all.filter(l => doneIds.has(l.id)).length;
  const percent = all.length ? Math.round((done / all.length) * 100) : 0;
  const first = (me.full_name || '').split(' ')[0];

  // "English course" rather than a bare course title: a student should be
  // told what they are looking at, not left to infer it from the name
  // their teacher gave the course.
  const subject = c.subject ? `${c.subject} course` : 'Your course';

  const chips = [
    // Their class first, when they are in one: a student checking this
    // page on a Saturday night mostly wants to know when they are next in.
    c.group ? chip(ICONS.clock, groupLabel(c.group)) : '',
    chip(ICONS.book, `${open.length} unit${open.length === 1 ? '' : 's'} open`),
    all.length ? chip(ICONS.tick, `${done} of ${all.length} lesson${all.length === 1 ? '' : 's'} done`) : '',
    openTests ? chip(ICONS.paper, `${openTests} test${openTests === 1 ? '' : 's'} to do`) : '',
    c.exam_date ? chip(ICONS.calendar, 'Exam ' + fmtDate(c.exam_date)) : '',
  ].filter(Boolean).join('');

  document.getElementById('course-card').innerHTML = `
    <div class="welcome-banner">
      ${SPARK}
      <div class="hero-inner">
        <div class="hero-kicker">${escHtml(subject)}</div>
        <div class="hero-hi">
          Hi ${escHtml(first || 'there')},<br>
          <span class="thin">Welcome to</span> ${escHtml(c.title || 'your course')}&nbsp;!
        </div>
        <div class="hero-chips">${chips}</div>
        ${all.length ? `
          <div class="hero-prog">
            <div class="hero-bar"><div class="hero-fill" style="width:${percent}%"></div></div>
            <div class="hero-prog-label">${percent}% of this course behind you</div>
          </div>` : ''}
      </div>
    </div>`;

  drawHelpPanel();
}

// The four-point star in the corner of the banner. Drawn rather than
// loaded, so it takes the theme's own gold and costs no request.
const SPARK = `<svg class="hero-spark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
  <path d="M50 0c2 26 22 48 50 50-28 2-48 24-50 50-2-26-22-48-50-50C28 48 48 26 50 0z"/>
</svg>`;

// ── How to use this page ──────────────────────────────────────────
// A teacher explaining the page once, on video, instead of explaining
// it to thirty students one at a time. Nothing is drawn until they have
// actually set a link in Settings.
function drawHelpPanel() {
  const host = document.getElementById('help-panel');
  const url = (me.teacher?.intro_video_url || '').trim();
  if (!url) { host.innerHTML = ''; return; }

  const embed = embedUrl(url);
  host.innerHTML = `<div class="help-panel">
    <h2>How to use this dashboard</h2>
    ${embed
      ? `<div class="help-video"><iframe src="${escHtml(embed)}" title="How to use this dashboard"
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"
           referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>`
      : `<a class="btn btn-primary btn-sm" href="${escHtml(url)}" target="_blank" rel="noopener">Watch the walkthrough</a>`}
  </div>`;
}

// Only these three are ever put in a frame. Anything else becomes a link
// the student clicks, because embedding a URL nobody has vouched for
// puts someone else's page inside this one.
function embedUrl(raw) {
  let u;
  try { u = new URL(raw); } catch (_) { return null; }
  const host = u.hostname.replace(/^www\./, '');

  if (host === 'youtu.be') {
    const id = u.pathname.slice(1);
    return /^[\w-]{6,}$/.test(id) ? `https://www.youtube-nocookie.com/embed/${id}` : null;
  }
  if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtube-nocookie.com') {
    const id = u.searchParams.get('v') || (u.pathname.startsWith('/embed/') ? u.pathname.slice(7) : '');
    return /^[\w-]{6,}$/.test(id) ? `https://www.youtube-nocookie.com/embed/${id}` : null;
  }
  if (host === 'vimeo.com' || host === 'player.vimeo.com') {
    const id = (u.pathname.match(/(\d{6,})/) || [])[1];
    return id ? `https://player.vimeo.com/video/${id}` : null;
  }
  if (host === 'drive.google.com') {
    const id = (u.pathname.match(/\/d\/([\w-]{10,})/) || [])[1];
    return id ? `https://drive.google.com/file/d/${id}/preview` : null;
  }
  return null;
}

const ICONS = {
  book:     '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  tick:     '<polyline points="20 6 9 17 4 12"/>',
  paper:    '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  lock:     '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  spark:    '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3.2"/>',
  file:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  play:     '<polygon points="5 3 19 12 5 21 5 3"/>',
  chev:     '<polyline points="6 9 12 15 18 9"/>',
  clock:    '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
};

function icon(path, cls = '') {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" class="${cls}">${path}</svg>`;
}

function chip(path, label) {
  return `<span class="hero-chip">${icon(path)}${escHtml(label)}</span>`;
}

function drawUnits(host, visible, byUnit, byLesson) {
  if (!visible.length) {
    host.innerHTML = `<div class="card"><div class="card-body">${emptyState(
      'Nothing released yet', 'Units appear here as your teacher opens them.')}</div></div>`;
    return;
  }

  host.innerHTML = visible.map((u, i) => {
    const open = moduleOpen(u);
    const lessons = (u.lessons || []).sort((a, b) => a.order_index - b.order_index);
    const unitTests = byUnit.get(u.id) || [];
    const doneHere = lessons.filter(l => doneIds.has(l.id)).length;
    const percent = lessons.length ? Math.round((doneHere / lessons.length) * 100) : 0;

    const counts = [`${lessons.length} lesson${lessons.length === 1 ? '' : 's'}`];
    const matCount = lessons.reduce((n, l) => n + (l.lesson_materials || []).length, 0);
    if (matCount) counts.push(`${matCount} handout${matCount === 1 ? '' : 's'}`);
    const testCount = unitTests.length + lessons.reduce((n, l) => n + (byLesson.get(l.id) || []).length, 0);
    if (testCount) counts.push(`${testCount} test${testCount === 1 ? '' : 's'}`);

    // Staggered, so the units settle in one after another rather than
    // all at once. Capped: the eighth unit should not wait a second.
    const delay = Math.min(i, 6) * 55;

    // A <details>, so the keyboard and screen readers get the open and
    // shut for free. Every unit starts closed: a term's worth of units
    // all open at once is a page nobody can find anything in.
    return `<details class="unit${open ? ' is-open' : ' lr-locked'}" style="animation-delay:${delay}ms"
        ${expanded.has(u.id) ? 'open' : ''} ontoggle="rememberUnit('${u.id}', this.open)">
      <summary class="unit-summary">
        <div class="unit-head">
          <div class="unit-num${open ? '' : ' locked'}">${open ? String(i + 1).padStart(2, '0') : icon(ICONS.lock)}</div>
          <div class="unit-meta">
            <div class="unit-title">${escHtml(u.title)}</div>
            <div class="small muted">${open ? counts.join(' · ') : 'Not open yet'}${u.description ? ' · ' + escHtml(u.description) : ''}</div>
          </div>
          ${open
            ? `<span class="badge ${doneHere === lessons.length && lessons.length ? 'b-green' : 'b-gray'}">${doneHere}/${lessons.length} done</span>`
            : `<span class="badge b-yellow">Opens ${escHtml(u.open_at ? fmtDateTime(u.open_at) : 'soon')}</span>`}
          ${open && practiceByUnit[u.id]
            // Offered only where there is something behind it, so the
            // button never leads to an empty page. The click is stopped
            // short of the summary, or opening practice would also flip
            // the unit shut behind them.
            ? `<a class="btn btn-outline btn-xs practise-btn" onclick="event.stopPropagation()"
                 href="/portal/practice.html?unit=${u.id}&course=${u.course_id}">${icon(ICONS.spark)}Practise</a>`
            : ''}
          <span class="unit-chev">${icon(ICONS.chev)}</span>
        </div>
        ${open && lessons.length ? `<div class="unit-bar"><span style="width:${percent}%"></span></div>` : ''}
      </summary>
      ${open
        ? (lessons.length || unitTests.length
            // Each lesson, then what hangs off it: the handouts to read
            // and the papers set on it, without leaving the page.
            ? lessons.map(l =>
                lessonRow(l)
                + (l.lesson_materials || []).map(materialRow).join('')
                + (byLesson.get(l.id) || []).map(t => testRow(t, true)).join('')
              ).join('')
              + (unitTests.length
                  ? `<div class="unit-tests">On the whole unit</div>${unitTests.map(t => testRow(t, false)).join('')}`
                  : '')
            : '<div class="locked-card">No lessons in this unit yet.</div>')
        : `<div class="locked-card">${icon(ICONS.lock, 'lock-big')}This unit opens ${escHtml(u.open_at ? fmtDateTime(u.open_at) : 'when your teacher is ready')}.</div>`}
    </details>`;
  }).join('');
}

const MAT_LABEL = { pdf: 'PDF', link: 'Link', sheet: 'Worksheet', recording: 'Recording' };

function materialRow(m) {
  const kind = MAT_LABEL[m.kind] || 'File';
  return `<div class="list-row under">
    <div class="lr-ic ic-doc">${icon(ICONS.file)}</div>
    <div style="flex:1;min-width:0">
      <div class="lr-title">${escHtml(m.title)}</div>
      <div class="lr-sub">${escHtml(kind)}</div>
    </div>
    <a href="${escHtml(m.file_url)}" target="_blank" rel="noopener" class="btn btn-outline btn-xs">Open</a>
  </div>`;
}

function testRow(t, under) {
  const best = bestByTest.get(t.id);
  const w = testWindow(t, new Date());
  const due = dueByTest.get(t.id);
  const late = due && new Date(due) < new Date();
  const bits = [
    t.time_limit_min ? t.time_limit_min + ' min' : null,
    `pass at ${t.passing_score_pct}%`,
    due ? `${late ? 'was due' : 'due'} ${fmtDateTime(due)}` : null,
  ].filter(Boolean).join(' · ');

  // Three states, and only one of them is a button: do it, do it again
  // for a better mark, or wait. A test whose window has closed is left
  // showing the mark, with nothing to click.
  const action = w.open
    ? `<a href="/portal/take-test.html?id=${t.id}" class="btn ${best ? 'btn-outline' : 'btn-primary'} btn-xs">${best ? 'Try again' : 'Start'}</a>`
    : `<span class="badge b-yellow">${escHtml(w.label)}</span>`;

  return `<div class="list-row${under ? ' under' : ''}">
    <div class="lr-ic ic-test">${icon(ICONS.paper)}</div>
    <div style="flex:1;min-width:0">
      <div class="lr-title">${escHtml(t.title)}
        ${sectionBadge(t.test_sections, 'margin-left:6px')}</div>
      <div class="lr-sub">${escHtml(bits)}</div>
    </div>
    ${best ? `<span class="badge ${best.passed ? 'b-green' : 'b-red'}">${pct(best.percentage)}</span>`
      : late ? '<span class="badge b-red">Late</span>' : ''}
    ${action}
  </div>`;
}

function lessonRow(l) {
  const done = doneIds.has(l.id);
  // A finished lesson turns its own icon into the tick, rather than
  // carrying a tick somewhere else on the row: it is the same piece of
  // information and it belongs in one place.
  return `<div class="list-row${done ? ' lr-done' : ''}">
    <div class="lr-ic">${icon(done ? ICONS.tick : ICONS.play)}</div>
    <div style="flex:1;min-width:0">
      <div class="lr-title">${escHtml(l.title)}</div>
      <div class="lr-sub">${l.duration_min ? l.duration_min + ' min' : 'Lesson'}${l.description ? ' · ' + escHtml(l.description) : ''}</div>
    </div>
    ${l.video_url ? `<a href="${escHtml(l.video_url)}" target="_blank" rel="noopener" class="btn btn-outline btn-xs">Watch</a>` : ''}
    <button class="btn ${done ? 'btn-ghost' : 'btn-primary'} btn-xs" onclick="toggleDone('${l.id}')">
      ${done ? 'Done ✓' : 'Mark done'}
    </button>
  </div>`;
}

async function toggleDone(lessonId) {
  const done = doneIds.has(lessonId);

  // Marking a lesson done is the one write a student makes casually, so
  // move the tick straight away and put it back only if the save fails.
  if (done) doneIds.delete(lessonId); else doneIds.add(lessonId);
  await load();

  const { error } = done
    ? await sb.from('lesson_completions').delete().eq('student_id', me.id).eq('lesson_id', lessonId)
    : await sb.from('lesson_completions').insert({
        teacher_id: me.teacher_id, student_id: me.id, lesson_id: lessonId,
      });

  if (error) {
    if (done) doneIds.add(lessonId); else doneIds.delete(lessonId);
    showToast(friendlyError(error.message), 'error');
    await load();
  }
}
</script>
