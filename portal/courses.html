<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My courses | Lumen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/portal.css">
<script>try{if(localStorage.getItem('lumen_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="page-title">My courses</span>
    </div>
  </header>

  <main class="content">
    <div class="courses-grid" id="courses">
      <div class="skel" style="height:130px"></div>
      <div class="skel" style="height:130px"></div>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/shell.js"></script>
<script>
(async () => {
  const me = await requireAuth('student');
  if (!me) return;
  renderShell('student', me, { title: 'My courses' });

  const [{ data: enrolments }, { data: done }, { data: lessons }] = await Promise.all([
    sb.from('enrollments').select('expires_at, courses(id, title, subject, description, exam_date)').eq('student_id', me.id),
    sb.from('lesson_completions').select('lesson_id').eq('student_id', me.id),
    sb.from('lessons').select('id, modules(course_id)'),
  ]);

  const courses = (enrolments || []).map(e => ({ ...e.courses, expires_at: e.expires_at })).filter(c => c?.id);
  const host = document.getElementById('courses');

  if (!courses.length) {
    host.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="card-body">${emptyState(
      'No courses yet',
      'Your teacher has not enrolled you on anything yet. Once they do, your lessons, tests and assignments all appear here.')}</div></div>`;
    return;
  }

  const doneIds = new Set((done || []).map(d => d.lesson_id));
  const counts = new Map();
  (lessons || []).forEach(l => {
    const cid = l.modules?.course_id;
    if (!cid) return;
    const row = counts.get(cid) || { total: 0, done: 0 };
    row.total++;
    if (doneIds.has(l.id)) row.done++;
    counts.set(cid, row);
  });

  host.innerHTML = courses.map(c => {
    const p = counts.get(c.id) || { total: 0, done: 0 };
    const percent = p.total ? Math.round((p.done / p.total) * 100) : 0;
    return `<a class="course-card" href="/portal/lessons.html?course=${c.id}">
      <div class="course-icon">${escHtml(initials(c.title))}</div>
      <div style="flex:1;min-width:0">
        <div class="course-subject">${escHtml(c.subject || 'Course')}</div>
        <div class="course-title">${escHtml(c.title)}</div>
        ${c.description ? `<div class="course-desc">${escHtml(c.description)}</div>` : ''}
        <div class="prog-row">
          <div class="prog-bar"><div class="prog-fill" style="width:${percent}%"></div></div>
          <span class="prog-pct">${percent}%</span>
        </div>
        <div class="small muted" style="margin-top:6px">
          ${p.done} of ${p.total} lesson${p.total === 1 ? '' : 's'}${c.exam_date ? ' · exam ' + fmtDate(c.exam_date) : ''}
        </div>
      </div>
    </a>`;
  }).join('');
})();
</script>
</body>
</html>
