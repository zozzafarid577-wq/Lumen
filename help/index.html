<link rel="stylesheet" href="/css/site.css">
<style>
  body { background: var(--cream); }
  .help-wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  .help-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .help-top img { height: 34px; }
  .vid { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
  .vid h2 { font-size: 1.15rem; margin: 0 0 2px; }
  .vid .ar { color: var(--muted); font-weight: 700; margin: 0 0 14px; }
  .frame { width: 100%; border: 0; border-radius: 14px; background: #000; display: block; margin: 0 auto; }
  .frame.tall { max-width: 360px; }
  .others { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
</style>

<body>
<div class="help-wrap">
  <div class="help-top">
    <a href="/"><img src="/assets/lumen-logo.png" alt="Lumen"></a>
    <a href="/login.html" class="btn btn-primary btn-sm">Open Lumen</a>
  </div>
  <h1 style="margin:0 0 4px">Help videos</h1>
  <p class="ar" dir="rtl" style="color:var(--muted);font-weight:700;margin:0 0 20px">فيديوهات شرح المنصة</p>
  <div class="vid" id="practice">
    <h2>How to practise</h2>
    <p class="ar" dir="rtl">ازاي تحل من بنك الأسئلة</p>
    <iframe class="frame" style="aspect-ratio:16 / 10" src="https://drive.google.com/file/d/12me8KGTbBTD38CC4ug2053QUW5wGMuUA/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="How to practise"></iframe>
  </div>
  <div class="vid" id="android">
    <h2>Install Lumen on Android</h2>
    <p class="ar" dir="rtl">تحميل المنصة على أندرويد</p>
    <iframe class="frame tall" style="aspect-ratio:9 / 16" src="https://drive.google.com/file/d/1e4TE0m8_ppEr3_Q0DGzpz0o8P3uBNy6o/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="Install Lumen on Android"></iframe>
  </div>
  <div class="vid" id="iphone">
    <h2>Install Lumen on iPhone</h2>
    <p class="ar" dir="rtl">تحميل المنصة على الآيفون</p>
    <iframe class="frame tall" style="aspect-ratio:9 / 16" src="https://drive.google.com/file/d/13wUuVLjfiG2k32a0a_-3cTlwbXYulkaQ/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="Install Lumen on iPhone"></iframe>
  </div>
</div>
